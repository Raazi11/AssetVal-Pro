<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetVal Pro v0.2</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.top{height:64px;background:#0b1324;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800;font-size:21px}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:235px;background:#101827;padding:14px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button:hover,.nav .active{background:#243147;color:white}.main{width:100%;max-width:1600px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0}.muted{color:#667085}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e5e9f0;border-radius:14px;padding:16px;box-shadow:0 8px 24px #00000008}.metric{font-size:23px;font-weight:800;margin-top:6px}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #d7dce5;border-radius:8px;padding:9px;background:white}.field textarea{min-height:80px}.btn{border:1px solid #d7dce5;background:white;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:white}.danger{background:#b42318;border-color:#b42318;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:9px;border:1px solid #d7dce5;border-radius:8px;min-width:250px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #edf0f4;padding:9px;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f8fafc}.badge{border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.chart{height:230px;display:flex;align-items:flex-end;gap:10px;padding:12px;border-bottom:1px solid #ddd}.bar{flex:1;min-width:18px;background:#2563eb;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;font-size:10px;left:50%;transform:translateX(-50%);white-space:nowrap}.photo{width:74px;height:58px;object-fit:cover;border-radius:7px;border:1px solid #ddd}.tagbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal .panel{max-width:650px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:750px){aside{display:none}.main{padding:14px}.cards,.two,.form{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}@media print{aside,.top,.actions,.toolbar{display:none}.main{padding:0}.panel{box-shadow:none}}
</style></head><body>
<div class="top"><div class="brand">◈ AssetVal Pro <small>v0.2</small></div><div id="companyTitle">Professional Asset Intelligence</div></div>
<div class="layout"><aside><div class="nav" id="nav"></div></aside><main class="main" id="main"></main></div><div id="modal" class="hidden"></div>
<script>
const KEY="assetval-pro-v02";let db=JSON.parse(localStorage.getItem(KEY)||"null")||{company:{name:"",currency:"SAR",valuationDate:new Date().toISOString().slice(0,10),method:"straight",rate:20,logo:""},locations:[],vendors:[],employees:[],assets:[],audit:[],services:[],transfers:[]};let page=db.company.name?"dashboard":"company",filter="";
const cats=["IT Equipment","TV / Display","Refrigerator / Appliance","CCTV / ELV","Furniture","Vehicle","Machinery","Other"],statuses=["Active","Lost","Damaged","Disposed","Under Repair"];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function id(){return crypto.randomUUID()}
function money(n){try{return new Intl.NumberFormat(undefined,{style:"currency",currency:db.company.currency||"SAR",maximumFractionDigits:0}).format(+n||0)}catch(e){return (+n||0)+" "+db.company.currency}}
function age(a){return Math.max(0,(new Date(db.company.valuationDate)-new Date(a.purchaseDate))/31557600000)}
function book(a,years=age(a)){let c=+a.cost||0,s=+a.salvage||0,l=Math.max(1,+a.life||5),y=Math.min(Math.max(0,years),l);if(db.company.method==="declining"){let v=c,r=Math.min(.95,(+a.rate||+db.company.rate||20)/100);for(let i=0;i<Math.floor(y);i++)v=Math.max(s,v*(1-r));return Math.max(s,v)}if(db.company.method==="sumdigits"){let n=l,rem=Math.max(0,l-Math.floor(y)),sum=n*(n+1)/2;return s+(c-s)*(rem*(rem+1)/2)/sum}return Math.max(s,c-y*(c-s)/l)}
function market(a){return Math.max(0,book(a)*(.65+(+a.condition||100)/285))}
function loc(x){let l=db.locations.find(z=>z.id===x);return l?l.name:"Unassigned"}
function vendor(x){let v=db.vendors.find(z=>z.id===x);return v?v.name:"—"}
function employee(x){let e=db.employees.find(z=>z.id===x);return e?e.name:"—"}
function nav(){let items=[["dashboard","Dashboard"],["assets","Asset Register"],["locations","Branches / Sites"],["vendors","Suppliers / Vendors"],["employees","Custodians"],["verify","Verify & Audit"],["services","AMC / Service"],["forecast","Forecast"],["valuation","Valuation"],["reports","Reports"],["settings","Company Setup"]];document.getElementById("nav").innerHTML=items.map(n=>"<button class='"+(page===n[0]?"active":"")+"' onclick=\"go('"+n[0]+"')\">"+n[1]+"</button>").join("")}
function go(p){page=p;render()}function render(){document.getElementById("companyTitle").textContent=db.company.name||"Professional Asset Intelligence";nav();document.getElementById("main").innerHTML=view()}
function fld(label,key,val,full=false,type="text",opts=[]){let c=type==="select"?"<select id='f_"+key+"'>"+opts.map(o=>"<option value='"+esc(o)+"' "+(String(o)===String(val)?"selected":"")+">"+esc(o)+"</option>").join("")+"</select>":"<input id='f_"+key+"' type='"+type+"' value='"+esc(val??"")+"'>";return "<div class='field "+(full?"full":"")+"'><label>"+label+"</label>"+c+"</div>"}
function metric(a,b){return "<div class='card'><div class='muted'>"+a+"</div><div class='metric'>"+b+"</div></div>"}
function view(){if(page==="company"||page==="settings")return company();if(page==="dashboard")return dashboard();if(page==="assets")return assets();if(page==="locations")return locations();if(page==="vendors")return vendors();if(page==="employees")return employees();if(page==="verify")return verify();if(page==="services")return services();if(page==="forecast")return forecast();if(page==="valuation")return valuation();return reports()}
function company(){let c=db.company;return "<div class='head'><div><h1>Company Setup</h1><div class='muted'>Company profile, currency, valuation date and depreciation defaults</div></div></div><div class='panel'><div class='form'>"+fld("Company name","name",c.name,true)+fld("Registration number","reg",c.reg)+fld("VAT number","vat",c.vat)+fld("Contact","contact",c.contact)+fld("Address","address",c.address,true)+fld("Base currency","currency",c.currency,false,"select",["SAR","INR","USD","AED","EUR","GBP"])+fld("Financial year","fy",c.fy||"2026")+fld("Default valuation date","valuationDate",c.valuationDate,false,"date")+fld("Depreciation method","method",c.method,false,"select",["straight","declining","sumdigits"])+fld("Default rate %","rate",c.rate)+fld("Default asset life (years)","lifeDefault",c.lifeDefault||5)+fld("Company logo URL","logo",c.logo,true)+ "</div><br><button class='btn primary' onclick='saveCompany()'>Save Company</button></div>"}
function saveCompany(){["name","reg","vat","contact","address","currency","fy","valuationDate","method","rate","lifeDefault","logo"].forEach(k=>{let e=document.getElementById("f_"+k);if(e)db.company[k]=e.value});save();go("dashboard")}
function dashboard(){let n=db.assets.length,c=db.assets.reduce((s,a)=>s+(+a.cost||0),0),b=db.assets.reduce((s,a)=>s+book(a),0),m=db.assets.reduce((s,a)=>s+market(a),0),v=db.assets.filter(a=>a.verified).length,lost=db.assets.filter(a=>a.status==="Lost").length,dmg=db.assets.filter(a=>a.status==="Damaged").length;let catsHtml=cats.map(x=>{let q=db.assets.filter(a=>a.category===x).length;return q?"<div>"+x+" — <b>"+q+"</b></div>":""}).join("");return "<div class='head'><div><h1>Asset Intelligence Dashboard</h1><div class='muted'>Register → Tag → Locate → Verify → Value → Depreciate → Maintain → Forecast → Audit → Report</div></div><div class='actions'><button class='btn primary' onclick='assetForm()'>+ Add Asset</button><button class='btn' onclick='go(\"reports\")'>Report</button></div></div><div class='cards'>"+metric("Assets",n)+metric("Acquisition",money(c))+metric("Book Value",money(b))+metric("Market Value",money(m))+metric("Verified",v+" / "+n)+metric("Lost / Damaged",lost+" / "+dmg)+"</div><div class='grid two' style='margin-top:15px'><div class='panel'><h3>Asset Categories</h3>"+catsHtml+"</div><div class='panel'><h3>Value by Year</h3>"+chart()+"</div></div>"}
function chart(){let vals=[0,1,2,3,4,5].map(y=>db.assets.reduce((s,a)=>s+book(a,age(a)+y),0));let max=Math.max(...vals,1);return "<div class='chart'>"+vals.map((v,i)=>"<div class='bar' style='height:"+Math.max(4,v/max*180)+"px'><span>"+(i===0?"Now":"Y+"+i)+"</span></div>").join("")+"</div>"}
function assets(){let aa=db.assets.filter(a=>JSON.stringify(a).toLowerCase().includes(filter.toLowerCase()));return "<div class='head'><div><h1>Asset Register</h1><div class='muted'>QR/barcode tags, photographs, invoices, custodians, warranty and lifecycle status.</div></div><div class='actions'><button class='btn' onclick='scanQR()'>📷 Scan QR</button><button class='btn' onclick='excelExport()'>Excel Export</button><button class='btn' onclick='csvExport()'>CSV Export</button><button class='btn primary' onclick='assetForm()'>+ Add Asset</button></div></div><div class='panel'><div class='toolbar'><input placeholder='Search tag, serial, model, employee...' value='"+esc(filter)+"' oninput='filter=this.value;render()'><button class='btn' onclick='excelImport()'>Import Excel</button><button class='btn' onclick='csvImport()'>Import CSV</button></div><div class='tablewrap'><table class='table'><tr><th>Tag</th><th>Photo</th><th>Asset</th><th>Category</th><th>Site</th><th>Custodian</th><th>Cost</th><th>Book</th><th>Status</th><th></th></tr>"+aa.map(a=>"<tr><td><b>"+esc(a.tag)+"</b></td><td>"+(a.photo?"<img class='photo' src='"+a.photo+"'>":"—")+"</td><td>"+esc(a.name)+"<br><span class='muted'>"+esc(a.serial)+"</span></td><td>"+esc(a.category)+"</td><td>"+esc(loc(a.location))+"</td><td>"+esc(employee(a.employee))+"</td><td>"+money(a.cost)+"</td><td>"+money(book(a))+"</td><td><span class='badge "+(a.status==="Active"?"good":a.status==="Damaged"?"warn":"bad")+"'>"+esc(a.status)+"</span></td><td><button class='btn' onclick=\"assetForm('"+a.id+"')\">Open</button></td></tr>").join("")+"</table></div></div>"}
function assetForm(assetId){let a=assetId?db.assets.find(x=>x.id===assetId):{id:id(),tag:"AV-"+String(db.assets.length+1).padStart(5,"0"),name:"",model:"",serial:"",category:"IT Equipment",location:"",employee:"",vendor:"",purchaseDate:new Date().toISOString().slice(0,10),cost:0,life:db.company.lifeDefault||5,salvage:0,condition:100,status:"Active",warrantyEnd:"",amcEnd:"",invoice:"",photo:"",notes:"",verified:false};document.getElementById("main").innerHTML="<div class='head'><h1>"+(assetId?"Asset Details":"Register Asset")+"</h1><button class='btn' onclick='go(\"assets\")'>Back</button></div><div class='panel'><div class='form'>"+fld("Asset tag","tag",a.tag)+fld("Asset name","name",a.name)+fld("Model","model",a.model)+fld("Serial number","serial",a.serial)+fld("Category","category",a.category,false,"select",cats)+fld("Branch / Site","location",a.location,false,"select",[""].concat(db.locations.map(x=>x.id)))+fld("Custodian / Employee","employee",a.employee,false,"select",[""].concat(db.employees.map(x=>x.id)))+fld("Supplier / Vendor","vendor",a.vendor,false,"select",[""].concat(db.vendors.map(x=>x.id)))+fld("Purchase date","purchaseDate",a.purchaseDate,false,"date")+fld("Acquisition cost","cost",a.cost)+fld("Useful life","life",a.life)+fld("Salvage value","salvage",a.salvage)+fld("Condition %","condition",a.condition)+fld("Status","status",a.status,false,"select",statuses)+fld("Warranty end","warrantyEnd",a.warrantyEnd||"",false,"date")+fld("AMC end","amcEnd",a.amcEnd||"",false,"date")+fld("Invoice file","invoice",a.invoice||"")+fld("Notes","notes",a.notes,true)+ "</div><br><div class='actions'><label class='btn'>📷 Asset Photo <input id='photoFile' type='file' accept='image/*' hidden onchange='photoPreview(event)'></label><button class='btn primary' onclick=\"saveAsset('"+a.id+"')\">Save Asset</button><button class='btn' onclick=\"tagModal('"+a.id+"')\">QR / Barcode</button><button class='btn' onclick=\"serviceForm('"+a.id+"')\">Add Service</button>"+(assetId?"<button class='btn' onclick=\"transferForm('"+a.id+"')\">Transfer</button>":"")+"</div><div id='photoPreview'></div></div>";window._asset=a}
function photoPreview(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window._photo=r.result;document.getElementById("photoPreview").innerHTML="<img class='photo' style='width:180px;height:130px;margin-top:10px' src='"+r.result+"'>"};r.readAsDataURL(f)}
function saveAsset(assetId){let a=db.assets.find(x=>x.id===assetId)||{id:assetId};["tag","name","model","serial","category","location","employee","vendor","purchaseDate","cost","life","salvage","condition","status","warrantyEnd","amcEnd","invoice","notes"].forEach(k=>{let e=document.getElementById("f_"+k);if(e)a[k]=e.value});if(window._photo)a.photo=window._photo; if(!db.assets.find(x=>x.id===assetId)){db.assets.push(a);db.audit.push({action:"Asset Registered",tag:a.tag,at:new Date().toLocaleString()})}save();window._photo=null;go("assets")}
function locations(){return "<div class='head'><h1>Branches / Sites</h1><button class='btn primary' onclick='locationForm()'>+ Add Site</button></div><div class='panel'><table class='table'><tr><th>Name</th><th>Department</th><th>Address</th><th>Assets</th></tr>"+db.locations.map(x=>"<tr><td>"+esc(x.name)+"</td><td>"+esc(x.dept)+"</td><td>"+esc(x.address)+"</td><td>"+db.assets.filter(a=>a.location===x.id).length+"</td></tr>").join("")+"</table></div>"}
function locationForm(){let x={id:id(),name:"",dept:"",address:""};document.getElementById("main").innerHTML="<div class='head'><h1>Add Branch / Site</h1></div><div class='panel'><div class='form'>"+fld("Site name","name","")+fld("Department","dept","")+fld("Address","address","",true)+"</div><br><button class='btn primary' onclick=\"saveLocation('"+x.id+"')\">Save Site</button></div>"}
function saveLocation(i){db.locations.push({id:i,name:document.getElementById("f_name").value,dept:document.getElementById("f_dept").value,address:document.getElementById("f_address").value});save();go("locations")}
function vendors(){return "<div class='head'><h1>Suppliers / Vendors</h1><button class='btn primary' onclick='vendorForm()'>+ Add Vendor</button></div><div class='panel'><table class='table'><tr><th>Vendor</th><th>Contact</th><th>Phone</th><th>Assets</th></tr>"+db.vendors.map(v=>"<tr><td>"+esc(v.name)+"</td><td>"+esc(v.contact)+"</td><td>"+esc(v.phone)+"</td><td>"+db.assets.filter(a=>a.vendor===v.id).length+"</td></tr>").join("")+"</table></div>"}
function vendorForm(){let x={id:id()};document.getElementById("main").innerHTML="<div class='panel'><h2>New Vendor</h2><div class='form'>"+fld("Vendor name","name","")+fld("Contact","contact","")+fld("Phone","phone","")+fld("Email","email","")+fld("Address","address","",true)+"</div><br><button class='btn primary' onclick=\"saveVendor('"+x.id+"')\">Save</button></div>"}
function saveVendor(i){db.vendors.push({id:i,name:document.getElementById("f_name").value,contact:document.getElementById("f_contact").value,phone:document.getElementById("f_phone").value,email:document.getElementById("f_email").value,address:document.getElementById("f_address").value});save();go("vendors")}
function employees(){return "<div class='head'><h1>Custodians / Employees</h1><button class='btn primary' onclick='employeeForm()'>+ Add Custodian</button></div><div class='panel'><table class='table'><tr><th>Name</th><th>Employee ID</th><th>Department</th><th>Assets</th></tr>"+db.employees.map(e=>"<tr><td>"+esc(e.name)+"</td><td>"+esc(e.empid)+"</td><td>"+esc(e.dept)+"</td><td>"+db.assets.filter(a=>a.employee===e.id).length+"</td></tr>").join("")+"</table></div>"}
function employeeForm(){let x={id:id()};document.getElementById("main").innerHTML="<div class='panel'><h2>New Custodian</h2><div class='form'>"+fld("Name","name","")+fld("Employee ID","empid","")+fld("Department","dept","")+fld("Phone","phone","")+fld("Email","email","")+fld("Location","location","")+"</div><br><button class='btn primary' onclick=\"saveEmployee('"+x.id+"')\">Save</button></div>"}
function saveEmployee(i){db.employees.push({id:i,name:document.getElementById("f_name").value,empid:document.getElementById("f_empid").value,dept:document.getElementById("f_dept").value,phone:document.getElementById("f_phone").value,email:document.getElementById("f_email").value,location:document.getElementById("f_location").value});save();go("employees")}
function verify(){let pending=db.assets.filter(a=>!a.verified);return "<div class='head'><div><h1>Verify & Audit</h1><div class='muted'>Full physical verification history.</div></div><button class='btn primary' onclick='verifyAll()'>Verify All</button></div><div class='panel'><table class='table'><tr><th>Tag</th><th>Asset</th><th>Location</th><th>Custodian</th><th>Condition</th><th></th></tr>"+pending.map(a=>"<tr><td>"+esc(a.tag)+"</td><td>"+esc(a.name)+"</td><td>"+esc(loc(a.location))+"</td><td>"+esc(employee(a.employee))+"</td><td>"+a.condition+"%</td><td><button class='btn' onclick=\"verifyOne('"+a.id+"')\">Verify</button></td></tr>").join("")+"</table></div><div class='panel'><h3>Audit History</h3>"+db.audit.slice().reverse().map(x=>"<div>"+esc(x.at)+" — <b>"+esc(x.action)+"</b> — "+esc(x.tag)+"</div>").join("")+"</div>"}
function verifyOne(i){let a=db.assets.find(x=>x.id===i);a.verified=true;db.audit.push({action:"Asset Verified",tag:a.tag,at:new Date().toLocaleString()});save();render()}
function verifyAll(){db.assets.forEach(a=>{if(!a.verified){a.verified=true;db.audit.push({action:"Asset Verified",tag:a.tag,at:new Date().toLocaleString()})}});save();render()}
function services(){return "<div class='head'><h1>AMC / Service History</h1><button class='btn primary' onclick='serviceForm()'>+ Add Service</button></div><div class='panel'><table class='table'><tr><th>Date</th><th>Asset</th><th>Type</th><th>Vendor</th><th>Cost</th><th>Next Due</th><th>Notes</th></tr>"+db.services.slice().reverse().map(s=>"<tr><td>"+esc(s.date)+"</td><td>"+esc((db.assets.find(a=>a.id===s.asset)||{}).tag||"—")+"</td><td>"+esc(s.type)+"</td><td>"+esc(s.vendor)+"</td><td>"+money(s.cost)+"</td><td>"+esc(s.next)+"</td><td>"+esc(s.notes)+"</td></tr>").join("")+"</table></div>"}
function serviceForm(assetId=""){document.getElementById("modal").className="modal";document.getElementById("modal").innerHTML="<div class='panel'><h2>Add Service / AMC</h2><div class='form'>"+fld("Asset","asset",assetId,false,"select",[""].concat(db.assets.map(a=>a.id)))+fld("Date","date",new Date().toISOString().slice(0,10),false,"date")+fld("Service type","type","AMC / Preventive Maintenance")+fld("Vendor","vendor","")+fld("Cost","cost",0)+fld("Next due","next","",false,"date")+fld("Notes","notes","",true)+"</div><br><button class='btn primary' onclick='saveService()'>Save</button> <button class='btn' onclick='closeModal()'>Cancel</button></div>"}
function saveService(){db.services.push({id:id(),asset:document.getElementById("f_asset").value,date:document.getElementById("f_date").value,type:document.getElementById("f_type").value,vendor:document.getElementById("f_vendor").value,cost:document.getElementById("f_cost").value,next:document.getElementById("f_next").value,notes:document.getElementById("f_notes").value});save();closeModal();go("services")}
function closeModal(){document.getElementById("modal").className="hidden";document.getElementById("modal").innerHTML=""}
function transferForm(assetId){document.getElementById("modal").className="modal";document.getElementById("modal").innerHTML="<div class='panel'><h2>Transfer Asset</h2><p>"+esc((db.assets.find(a=>a.id===assetId)||{}).tag)+"</p>"+fld("New location","to","",false,"select",[""].concat(db.locations.map(x=>x.id)))+fld("Reason","reason","")+ "<br><button class='btn primary' onclick=\"saveTransfer('"+assetId+"')\">Transfer</button> <button class='btn' onclick='closeModal()'>Cancel</button></div>"}
function saveTransfer(i){let a=db.assets.find(x=>x.id===i),old=a.location,a2=document.getElementById("f_to").value;a.location=a2;db.transfers.push({asset:i,from:old,to:a2,reason:document.getElementById("f_reason").value,at:new Date().toLocaleString()});db.audit.push({action:"Asset Transferred",tag:a.tag,at:new Date().toLocaleString()});save();closeModal();go("assets")}
function forecast(){let rows=[1,3,5].map(y=>{let val=db.assets.reduce((s,a)=>s+book(a,age(a)+y),0);return "<div class='card'><div class='muted'>"+y+" Year Forecast</div><div class='metric'>"+money(val)+"</div></div>"}).join("");let repl=db.assets.filter(a=>age(a)>=(+a.life||5)*.8||+a.condition<50);return "<div class='head'><div><h1>Asset Forecast</h1><div class='muted'>Projected book value and replacement planning.</div></div></div><div class='cards'>"+rows+"</div><div class='panel' style='margin-top:15px'><h3>Replacement Planning</h3><table class='table'><tr><th>Tag</th><th>Asset</th><th>Age</th><th>Condition</th><th>Book Value</th><th>Plan</th></tr>"+repl.map(a=>"<tr><td>"+esc(a.tag)+"</td><td>"+esc(a.name)+"</td><td>"+age(a).toFixed(1)+" yrs</td><td>"+a.condition+"%</td><td>"+money(book(a))+"</td><td><span class='badge warn'>Plan Replacement</span></td></tr>").join("")+"</table></div>"}
function valuation(){let c=db.assets.reduce((s,a)=>s+(+a.cost||0),0),b=db.assets.reduce((s,a)=>s+book(a),0),m=db.assets.reduce((s,a)=>s+market(a),0);return "<div class='head'><h1>Valuation Review</h1></div><div class='cards'>"+metric("Acquisition",money(c))+metric("Book Value",money(b))+metric("Market Value",money(m))+metric("Depreciation",money(c-b))+metric("Verified",db.assets.filter(a=>a.verified).length)+metric("Disposed",db.assets.filter(a=>a.status==="Disposed").length)+"</div><div class='panel' style='margin-top:15px'><table class='table'><tr><th>Asset</th><th>Cost</th><th>Book</th><th>Market</th><th>Condition</th><th>Decision</th></tr>"+db.assets.map(a=>{let r=a.status==="Disposed"?"Disposed":a.condition<40?"Replace / Sell":a.condition<65?"Repair / Monitor":"Keep";return "<tr><td>"+esc(a.tag)+" — "+esc(a.name)+"</td><td>"+money(a.cost)+"</td><td>"+money(book(a))+"</td><td>"+money(market(a))+"</td><td>"+a.condition+"%</td><td>"+r+"</td></tr>"}).join("")+"</table></div>"}
function reports(){let c=db.assets.reduce((s,a)=>s+(+a.cost||0),0),b=db.assets.reduce((s,a)=>s+book(a),0),m=db.assets.reduce((s,a)=>s+market(a),0);return "<div class='head'><div><h1>Company Asset Valuation Summary</h1><div class='muted'>Professional report template</div></div><button class='btn primary' onclick='window.print()'>Print / Save PDF</button></div><div class='panel'>"+(db.company.logo?"<img src='"+esc(db.company.logo)+"' style='max-height:70px;max-width:180px'>":"")+"<h2>"+esc(db.company.name||"Company")+"</h2><p>Valuation Date: <b>"+esc(db.company.valuationDate)+"</b> · Currency: <b>"+esc(db.company.currency)+"</b></p><div class='cards'>"+metric("Total Assets",db.assets.length)+metric("Acquisition",money(c))+metric("Book Value",money(b))+metric("Market Value",money(m))+metric("Depreciation",money(c-b))+metric("Verified",db.assets.filter(a=>a.verified).length)+"</div><h3>Asset Detail</h3><table class='table'><tr><th>Tag</th><th>Asset</th><th>Category</th><th>Site</th><th>Custodian</th><th>Cost</th><th>Book</th><th>Status</th></tr>"+db.assets.map(a=>"<tr><td>"+esc(a.tag)+"</td><td>"+esc(a.name)+"</td><td>"+esc(a.category)+"</td><td>"+esc(loc(a.location))+"</td><td>"+esc(employee(a.employee))+"</td><td>"+money(a.cost)+"</td><td>"+money(book(a))+"</td><td>"+esc(a.status)+"</td></tr>").join("")+"</table></div>"}
function tagModal(assetId){let a=db.assets.find(x=>x.id===assetId);document.getElementById("modal").className="modal";document.getElementById("modal").innerHTML="<div class='panel'><h2>Asset Tag — "+esc(a.tag)+"</h2><div class='tagbox'><div id='qr'></div><svg id='barcode'></svg></div><br><button class='btn primary' onclick='printTag()'>Print Tag</button> <button class='btn' onclick='closeModal()'>Close</button></div>";new QRCode(document.getElementById("qr"),{text:location.href+"#asset="+a.id,width:180,height:180});JsBarcode("#barcode",a.tag,{format:"CODE128",width:2,height:60,displayValue:true})}
function printTag(){let p=document.querySelector("#modal .panel").innerHTML;let w=window.open("","tag");w.document.write("<html><body style='font-family:Arial;text-align:center'>"+p+"</body></html>");w.print()}
async function scanQR(){if(!("BarcodeDetector" in window)){alert("QR scanning requires a modern browser with BarcodeDetector support. Open AssetVal Pro on a phone using Chrome/Edge.");return}let modal=document.getElementById("modal");modal.className="modal";modal.innerHTML="<div class='panel'><h2>Scan Asset QR</h2><video id='cam' autoplay playsinline style='width:100%;max-height:420px'></video><p class='muted'>Allow camera access and point at an AssetVal Pro QR tag.</p><button class='btn' onclick='closeModal()'>Cancel</button></div>";let video=document.getElementById("cam"),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});video.srcObject=stream;let detector=new BarcodeDetector({formats:["qr_code"]});let loop=async()=>{if(modal.className==="hidden"){stream.getTracks().forEach(t=>t.stop());return}try{let codes=await detector.detect(video);if(codes.length){let raw=codes[0].rawValue,assetId=(raw.split("#asset=")[1]||"");stream.getTracks().forEach(t=>t.stop());closeModal();let a=db.assets.find(x=>x.id===assetId||x.tag===raw);if(a)assetForm(a.id);else alert("Asset not found: "+raw);return}}catch(e){}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function excelExport(){let rows=db.assets.map(a=>({Tag:a.tag,Name:a.name,Model:a.model,Serial:a.serial,Category:a.category,Location:loc(a.location),Custodian:employee(a.employee),Vendor:vendor(a.vendor),PurchaseDate:a.purchaseDate,Cost:+a.cost,BookValue:Math.round(book(a)),MarketValue:Math.round(market(a)),Condition:a.condition,Status:a.status,Verified:a.verified, WarrantyEnd:a.warrantyEnd, AMCEnd:a.amcEnd}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Assets");XLSX.writeFile(wb,"AssetVal-Pro-Asset-Register.xlsx")}
function excelImport(){let i=document.createElement("input");i.type="file";i.accept=".xlsx,.xls";i.onchange=()=>{let r=new FileReader();r.onload=e=>{let wb=XLSX.read(e.target.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);rows.forEach(x=>db.assets.push({id:id(),tag:x.Tag||"AV-"+(db.assets.length+1),name:x.Name||"",model:x.Model||"",serial:x.Serial||"",category:x.Category||"Other",location:"",employee:"",vendor:"",purchaseDate:x.PurchaseDate||db.company.valuationDate,cost:+x.Cost||0,life:+x.Life||db.company.lifeDefault||5,salvage:+x.Salvage||0,condition:+x.Condition||100,status:x.Status||"Active",verified:!!x.Verified,warrantyEnd:x.WarrantyEnd||"",amcEnd:x.AMCEnd||"",photo:"",invoice:"",notes:""}));save();render()};r.readAsArrayBuffer(i.files[0])};i.click()}
function csvExport(){let h=["tag","name","model","serial","category","location","employee","vendor","purchaseDate","cost","life","salvage","condition","status","verified","warrantyEnd","amcEnd"];let out=[h.join(",")].concat(db.assets.map(a=>h.map(k=>"\""+String(a[k]??"").replace(/"/g,"\"\"")+"\"").join(",")));download("AssetVal-Pro.csv",out.join("\n"),"text/csv")}
function csvImport(){let i=document.createElement("input");i.type="file";i.accept=".csv";i.onchange=()=>{let r=new FileReader();r.onload=e=>{let lines=String(e.target.result).split(/\r?\n/).filter(Boolean),h=lines.shift().split(",");lines.forEach(line=>{let v=line.match(/(?:"[^"]*"|[^,])+/g)||[],a={id:id()};h.forEach((k,j)=>a[k]=String(v[j]||"").replace(/^"|"$/g,"").replace(/""/g,"\""));a.verified=a.verified==="true";db.assets.push(a)});save();render()};r.readAsText(i.files[0])};i.click()}
function download(n,d,t){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
render();
</script></body></html>

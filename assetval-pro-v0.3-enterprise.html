<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1324"><title>AssetVal Pro v0.3 Enterprise</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.top{height:64px;background:#0b1324;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:800;font-size:20px}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:245px;background:#101827;padding:12px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:10px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button:hover,.nav .active{background:#243147;color:#fff}.main{width:100%;max-width:1700px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h1{margin:0}.muted{color:#667085}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:15px;box-shadow:0 7px 22px #00000008}.metric{font-size:22px;font-weight:800;margin-top:5px}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #d7dce5;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:80px}.btn{border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.danger{background:#b42318;border-color:#b42318;color:#fff}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.toolbar input{padding:9px;border:1px solid #d7dce5;border-radius:8px;min-width:230px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #edf0f4;padding:8px;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f8fafc}.badge{border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.barbox{height:220px;display:flex;align-items:flex-end;gap:8px;padding:10px;border-bottom:1px solid #ddd}.bar{flex:1;background:#2563eb;border-radius:4px 4px 0 0;min-width:10px}.bar small{display:block;text-align:center;transform:translateY(18px);font-size:9px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal .panel{max-width:720px;width:100%;max-height:92vh;overflow:auto}.hidden{display:none}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101827}.login .panel{width:390px}.kpi{font-size:12px;color:#667085}.timeline div{padding:9px;border-left:3px solid #2563eb;margin:7px 0;background:#f8fafc}.drop{border:2px dashed #cbd5e1;border-radius:10px;padding:18px;text-align:center}.notice{padding:10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:10px}@media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}.three{grid-template-columns:1fr 1fr}}@media(max-width:750px){aside{display:none}.main{padding:12px}.cards,.two,.three,.form{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.top{height:58px}.table th,.table td{font-size:12px}.brand small{display:none}}@media print{aside,.top,.actions,.toolbar,.no-print{display:none}.main{padding:0}.panel{box-shadow:none}}
</style></head><body><div id="app"></div><div id="modal" class="hidden"></div>
<script>
const KEY='assetval-pro-v03-enterprise', USERS='assetval-pro-v03-users';
const seed={companies:[{id:'default',name:'',currency:'SAR',valuationDate:new Date().toISOString().slice(0,10),method:'straight',rate:20,lifeDefault:5,logo:'',reg:'',vat:'',address:'',contact:''}],activeCompany:'default',assets:[],locations:[],vendors:[],employees:[],services:[],transfers:[],audit:[],approvals:[],attachments:[],notifications:[],session:null};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
let users=JSON.parse(localStorage.getItem(USERS)||'null')||[{id:'u-admin',user:'admin',name:'Administrator',role:'Admin',pass:'admin123'}];
let page='dashboard',filter='';
function save(){localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(USERS,JSON.stringify(users))}
function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}
function me(){return users.find(u=>u.id===db.session)}
function company(){return db.companies.find(c=>c.id===db.activeCompany)||db.companies[0]}
function money(n){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:company().currency||'SAR',maximumFractionDigits:0}).format(+n||0)}catch(e){return (+n||0)+' '+company().currency}}
function age(a){return Math.max(0,(new Date(company().valuationDate)-new Date(a.purchaseDate||company().valuationDate))/31557600000)}
function book(a,years=age(a)){let c=+a.cost||0,s=+a.salvage||0,l=Math.max(1,+a.life||company().lifeDefault||5),y=Math.min(Math.max(0,years),l);if(company().method==='declining'){let v=c,r=Math.min(.95,(+a.rate||company().rate||20)/100);for(let i=0;i<Math.floor(y);i++)v=Math.max(s,v*(1-r));return Math.max(s,v)}if(company().method==='sumdigits'){let n=l,rem=Math.max(0,l-Math.floor(y)),sum=n*(n+1)/2;return s+(c-s)*(rem*(rem+1)/2)/sum}return Math.max(s,c-y*(c-s)/l)}
function market(a){return Math.max(0,book(a)*(.65+(+a.condition||100)/285))}
function loc(x){return (db.locations.find(z=>z.id===x)||{}).name||'Unassigned'}
function emp(x){return (db.employees.find(z=>z.id===x)||{}).name||'—'}
function vend(x){return (db.vendors.find(z=>z.id===x)||{}).name||'—'}
function fld(label,key,val,full=false,type='text',opts=[]){let c=type==='select'?'<select id="f_'+key+'">'+opts.map(o=>'<option value="'+esc(o)+'" '+(String(o)===String(val)?'selected':'')+'>'+esc(o&&((db.locations.find(z=>z.id===o)||db.employees.find(z=>z.id===o)||db.vendors.find(z=>z.id===o)||{}).name||o)||'Unassigned')+'</option>').join('')+'</select>':'<input id="f_'+key+'" type="'+type+'" value="'+esc(val??'')+'">';return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label>'+c+'</div>'}
function metric(a,b){return '<div class="card"><div class="muted">'+a+'</div><div class="metric">'+b+'</div></div>'}
function nav(){let items=[['dashboard','Dashboard'],['assets','Asset Register'],['scan','Inventory Scanner'],['approvals','Approval Workflow'],['companies','Multi-Company'],['locations','Branches / Sites'],['employees','Custodians'],['vendors','Suppliers'],['services','AMC / Service'],['reports','Advanced Reports'],['backup','Backup / Restore'],['notify','Notifications'],['finance','Financial Analytics'],['settings','Company Setup'],['users','Users & Security']];return '<div class="nav">'+items.map(n=>'<button class="'+(page===n[0]?'active':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>').join('')+'</div>'}
function shell(){let c=company();return '<div class="top"><div class="brand">◈ AssetVal Pro <small>v0.3 Enterprise</small></div><div>'+esc(c.name||'Enterprise Asset Intelligence')+' · '+esc(me().name)+' <button class="btn" onclick="logout()">Logout</button></div></div><div class="layout"><aside>'+nav()+'</aside><main class="main" id="main"></main></div><div id="modal" class="hidden"></div>'}
function go(p){page=p;render()}
function render(){if(!db.session){login();return}document.getElementById('app').innerHTML=shell();document.getElementById('main').innerHTML=view()}
function login(){document.getElementById('app').innerHTML='<div class="login"><div class="panel"><h1>AssetVal Pro</h1><p class="muted">Enterprise Operations</p><div class="field"><label>Username</label><input id="lu" value="admin"></div><br><div class="field"><label>Password</label><input id="lp" type="password" value="admin123"></div><br><button class="btn primary" style="width:100%" onclick="doLogin()">Sign in</button><p class="muted">Demo administrator: admin / admin123</p></div></div>'}
function doLogin(){let u=users.find(x=>x.user===document.getElementById('lu').value&&x.pass===document.getElementById('lp').value);if(!u)return alert('Invalid login');db.session=u.id;save();render()}
function logout(){db.session=null;save();render()}
function can(role){let r=me().role;return r==='Admin'||r===role}
function view(){return ({dashboard,assets,scan,approvals,companies,locations,employees,vendors,services,reports,backup:backupView,notify,finance,settings,users}[page]||dashboard)()}
function dashboard(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany),c=aa.reduce((s,a)=>s+(+a.cost||0),0),b=aa.reduce((s,a)=>s+book(a),0),m=aa.reduce((s,a)=>s+market(a),0),due=db.notifications.filter(n=>!n.read).length,repl=aa.filter(a=>age(a)>=(+a.life||5)*.8||+a.condition<50).length;return '<div class="head"><div><h1>Enterprise Asset Intelligence</h1><div class="muted">Register → Tag → Verify → Value → Approve → Maintain → Forecast → Audit → Report</div></div><div class="actions"><button class="btn primary" onclick="assetForm()">+ Add Asset</button><button class="btn" onclick="go(\'scan\')">📷 Inventory Scan</button></div></div><div class="cards">'+metric('Assets',aa.length)+metric('Acquisition',money(c))+metric('Book Value',money(b))+metric('Market Value',money(m))+metric('Pending Approvals',db.approvals.filter(x=>x.status==='Pending').length)+metric('Alerts',due)+'</div><div class="grid two" style="margin-top:14px"><div class="panel"><h3>Replacement / Risk</h3><p>'+repl+' assets require replacement planning.</p><p>'+aa.filter(a=>!a.verified).length+' assets remain unverified.</p><p>'+aa.filter(a=>a.status==='Lost'||a.status==='Damaged').length+' lost/damaged assets.</p></div><div class="panel"><h3>5-Year Financial Forecast</h3>'+forecastBars(aa)+'</div></div>'}
function forecastBars(aa){let v=[0,1,2,3,4,5].map(y=>aa.reduce((s,a)=>s+book(a,age(a)+y),0)),mx=Math.max(...v,1);return '<div class="barbox">'+v.map((x,i)=>'<div class="bar" style="height:'+Math.max(5,x/mx*185)+'px"><small>'+(i?'Y+'+i:'Now')+'</small></div>').join('')+'</div>'}
function assets(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany&&JSON.stringify(a).toLowerCase().includes(filter.toLowerCase()));return '<div class="head"><div><h1>Asset Register</h1><div class="muted">Lifecycle, custody, attachments, approval and valuation control.</div></div><div class="actions"><button class="btn" onclick="go(\'scan\')">📷 Scan</button><button class="btn" onclick="excelExport()">Excel</button><button class="btn primary" onclick="assetForm()">+ Asset</button></div></div><div class="panel"><div class="toolbar"><input placeholder="Search tag, serial, model, custodian..." value="'+esc(filter)+'" oninput="filter=this.value;render()"><button class="btn" onclick="backup()">Quick Backup</button></div><div class="tablewrap"><table class="table"><tr><th>Tag</th><th>Asset</th><th>Site</th><th>Custodian</th><th>Cost</th><th>Book</th><th>Status</th><th>Approval</th><th></th></tr>'+aa.map(a=>'<tr><td><b>'+esc(a.tag)+'</b></td><td>'+esc(a.name)+'<br><span class="muted">'+esc(a.serial)+'</span></td><td>'+esc(loc(a.location))+'</td><td>'+esc(emp(a.employee))+'</td><td>'+money(a.cost)+'</td><td>'+money(book(a))+'</td><td><span class="badge '+(a.status==='Active'?'good':a.status==='Damaged'?'warn':'bad')+'">'+esc(a.status)+'</span></td><td>'+esc(a.approval||'Approved')+'</td><td><button class="btn" onclick="assetForm(\''+a.id+'\')">Open</button></td></tr>').join('')+'</table></div></div>'}
function assetForm(assetId){let a=assetId?db.assets.find(x=>x.id===assetId):{id:id(),companyId:db.activeCompany,tag:'AV-'+String(db.assets.length+1).padStart(5,'0'),name:'',model:'',serial:'',category:'IT Equipment',location:'',employee:'',vendor:'',purchaseDate:company().valuationDate,cost:0,life:company().lifeDefault||5,salvage:0,condition:100,status:'Active',warrantyEnd:'',amcEnd:'',invoice:'',notes:'',verified:false,approval:'Pending'};document.getElementById('main').innerHTML='<div class="head"><h1>'+(assetId?'Asset Details':'Register Asset')+'</h1><button class="btn" onclick="go(\'assets\')">Back</button></div><div class="panel"><div class="form">'+fld('Asset tag','tag',a.tag)+fld('Asset name','name',a.name)+fld('Model','model',a.model)+fld('Serial number','serial',a.serial)+fld('Category','category',a.category,false,'select',['IT Equipment','TV / Display','Refrigerator / Appliance','CCTV / ELV','Furniture','Vehicle','Machinery','Other'])+fld('Branch / Site','location',a.location,false,'select',[''].concat(db.locations.filter(x=>x.companyId===db.activeCompany).map(x=>x.id)))+fld('Custodian','employee',a.employee,false,'select',[''].concat(db.employees.filter(x=>x.companyId===db.activeCompany).map(x=>x.id)))+fld('Supplier','vendor',a.vendor,false,'select',[''].concat(db.vendors.filter(x=>x.companyId===db.activeCompany).map(x=>x.id)))+fld('Purchase date','purchaseDate',a.purchaseDate,false,'date')+fld('Acquisition cost','cost',a.cost,'')+fld('Useful life','life',a.life)+fld('Salvage value','salvage',a.salvage)+fld('Condition %','condition',a.condition)+fld('Status','status',a.status,false,'select',['Active','Lost','Damaged','Disposed','Under Repair'])+fld('Warranty end','warrantyEnd',a.warrantyEnd||'',false,'date')+fld('AMC end','amcEnd',a.amcEnd||'',false,'date')+fld('Invoice reference','invoice',a.invoice)+fld('Notes','notes',a.notes,true)+'</div><br><div class="actions"><button class="btn primary" onclick="saveAsset(\''+a.id+'\')">Save</button><button class="btn" onclick="attachForm(\''+a.id+'\')">📎 Attachments</button><button class="btn" onclick="timeline(\''+a.id+'\')">Lifecycle</button><button class="btn" onclick="tag(\''+a.id+'\')">QR / Barcode</button>'+(assetId?'<button class="btn" onclick="transferForm(\''+a.id+'\')">Transfer</button>':'')+'</div></div>'}
function saveAsset(i){let a=db.assets.find(x=>x.id===i)||{id:i};['tag','name','model','serial','category','location','employee','vendor','purchaseDate','cost','life','salvage','condition','status','warrantyEnd','amcEnd','invoice','notes'].forEach(k=>{let e=document.getElementById('f_'+k);if(e)a[k]=e.value});a.companyId=db.activeCompany;if(!db.assets.find(x=>x.id===i)){a.approval='Pending';db.assets.push(a);requestApproval('Asset Registration',a.id)}else if(can('Asset Manager')){a.approval='Pending';requestApproval('Asset Change',a.id)}db.audit.push({companyId:db.activeCompany,action:'Asset saved',tag:a.tag,by:me().name,at:new Date().toLocaleString()});save();go('assets')}
function requestApproval(type,ref){db.approvals.push({id:id(),companyId:db.activeCompany,type,ref,status:'Pending',requestedBy:me().name,at:new Date().toLocaleString()});db.notifications.push({id:id(),companyId:db.activeCompany,title:'Approval required',body:type,read:false,at:new Date().toLocaleString()})}
function approvals(){let aa=db.approvals.filter(x=>x.companyId===db.activeCompany);return '<div class="head"><div><h1>Approval Workflow</h1><div class="muted">Control registration, transfers and disposal.</div></div></div><div class="panel"><table class="table"><tr><th>Type</th><th>Reference</th><th>Requested By</th><th>Status</th><th>Action</th></tr>'+aa.slice().reverse().map(x=>'<tr><td>'+esc(x.type)+'</td><td>'+esc((db.assets.find(a=>a.id===x.ref)||{}).tag||x.ref)+'</td><td>'+esc(x.requestedBy)+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='Pending'&&can('Admin')?'<button class="btn primary" onclick="approve(\''+x.id+'\',true)">Approve</button> <button class="btn danger" onclick="approve(\''+x.id+'\',false)">Reject</button>':'—')+'</td></tr>').join('')+'</table></div>'}
function approve(i,ok){let x=db.approvals.find(a=>a.id===i);x.status=ok?'Approved':'Rejected';x.approvedBy=me().name;x.approvedAt=new Date().toLocaleString();let a=db.assets.find(a=>a.id===x.ref);if(a)a.approval=x.status;save();render()}
function companies(){return '<div class="head"><h1>Multi-Company</h1><button class="btn primary" onclick="companyForm()">+ Company</button></div><div class="panel"><table class="table"><tr><th>Company</th><th>Currency</th><th>Valuation Date</th><th>Assets</th><th></th></tr>'+db.companies.map(c=>'<tr><td><b>'+esc(c.name||'Unnamed Company')+'</b></td><td>'+esc(c.currency)+'</td><td>'+esc(c.valuationDate)+'</td><td>'+db.assets.filter(a=>a.companyId===c.id).length+'</td><td><button class="btn '+(c.id===db.activeCompany?'primary':'')+'" onclick="switchCompany(\''+c.id+'\')">Use</button></td></tr>').join('')+'</table></div>'}
function companyForm(){let i=id();document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>New Company</h2><div class="form">'+fld('Company name','name','')+fld('Currency','currency','SAR',false,'select',['SAR','INR','USD','AED','EUR','GBP'])+fld('Registration','reg','')+fld('VAT','vat','')+fld('Address','address','',true)+'</div><br><button class="btn primary" onclick="saveCompany(\''+i+'\')">Create</button> <button class="btn" onclick="closeModal()">Cancel</button></div>'}
function saveCompany(i){db.companies.push({id:i,name:document.getElementById('f_name').value,currency:document.getElementById('f_currency').value,reg:document.getElementById('f_reg').value,vat:document.getElementById('f_vat').value,address:document.getElementById('f_address').value,valuationDate:new Date().toISOString().slice(0,10),method:'straight',rate:20,lifeDefault:5,logo:''});save();closeModal();go('companies')}
function switchCompany(i){db.activeCompany=i;save();go('dashboard')}
function locations(){return '<div class="head"><h1>Branches / Sites</h1><button class="btn primary" onclick="simpleForm(\'location\')">+ Site</button></div><div class="panel"><table class="table"><tr><th>Name</th><th>Department</th><th>Address</th><th>Assets</th></tr>'+db.locations.filter(x=>x.companyId===db.activeCompany).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.dept)+'</td><td>'+esc(x.address)+'</td><td>'+db.assets.filter(a=>a.location===x.id).length+'</td></tr>').join('')+'</table></div>'}
function employees(){return '<div class="head"><h1>Custodians / Employees</h1><button class="btn primary" onclick="simpleForm(\'employee\')">+ Custodian</button></div><div class="panel"><table class="table"><tr><th>Name</th><th>ID</th><th>Department</th><th>Assets</th></tr>'+db.employees.filter(x=>x.companyId===db.activeCompany).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.empid)+'</td><td>'+esc(x.dept)+'</td><td>'+db.assets.filter(a=>a.employee===x.id).length+'</td></tr>').join('')+'</table></div>'}
function vendors(){return '<div class="head"><h1>Suppliers / Vendors</h1><button class="btn primary" onclick="simpleForm(\'vendor\')">+ Vendor</button></div><div class="panel"><table class="table"><tr><th>Vendor</th><th>Contact</th><th>Phone</th><th>Assets</th></tr>'+db.vendors.filter(x=>x.companyId===db.activeCompany).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.contact)+'</td><td>'+esc(x.phone)+'</td><td>'+db.assets.filter(a=>a.vendor===x.id).length+'</td></tr>').join('')+'</table></div>'}
function simpleForm(type){let i=id(),fields=type==='location'?fld('Site name','name','')+fld('Department','dept','')+fld('Address','address','',true):type==='employee'?fld('Name','name','')+fld('Employee ID','empid','')+fld('Department','dept','')+fld('Phone','phone',''):fld('Vendor name','name','')+fld('Contact','contact','')+fld('Phone','phone','')+fld('Email','email','');document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>New '+type+'</h2><div class="form">'+fields+'</div><br><button class="btn primary" onclick="saveSimple(\''+type+'\',\''+i+'\')">Save</button> <button class="btn" onclick="closeModal()">Cancel</button></div>'}
function saveSimple(t,i){let o={id:i,companyId:db.activeCompany,name:document.getElementById('f_name').value};['dept','address','empid','phone','contact','email'].forEach(k=>{let e=document.getElementById('f_'+k);if(e)o[k]=e.value});(t==='location'?db.locations:t==='employee'?db.employees:db.vendors).push(o);save();closeModal();go(t==='location'?'locations':t==='employee'?'employees':'vendors')}
function services(){return '<div class="head"><h1>AMC / Service History</h1><button class="btn primary" onclick="serviceForm()">+ Service</button></div><div class="panel"><table class="table"><tr><th>Date</th><th>Asset</th><th>Type</th><th>Vendor</th><th>Cost</th><th>Next Due</th></tr>'+db.services.filter(s=>s.companyId===db.activeCompany).slice().reverse().map(s=>'<tr><td>'+esc(s.date)+'</td><td>'+esc((db.assets.find(a=>a.id===s.asset)||{}).tag)+'</td><td>'+esc(s.type)+'</td><td>'+esc(s.vendor)+'</td><td>'+money(s.cost)+'</td><td>'+esc(s.next)+'</td></tr>').join('')+'</table></div>'}
function serviceForm(){let i=id();document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>Service / AMC</h2><div class="form">'+fld('Asset','asset','',false,'select',[''].concat(db.assets.filter(a=>a.companyId===db.activeCompany).map(a=>a.id)))+fld('Date','date',company().valuationDate,false,'date')+fld('Type','type','Preventive Maintenance')+fld('Vendor','vendor','')+fld('Cost','cost',0)+fld('Next due','next','',false,'date')+fld('Notes','notes','',true)+'</div><br><button class="btn primary" onclick="saveService(\''+i+'\')">Save</button></div>'}
function saveService(i){let o={id:i,companyId:db.activeCompany};['asset','date','type','vendor','cost','next','notes'].forEach(k=>o[k]=document.getElementById('f_'+k).value);db.services.push(o);save();closeModal();go('services')}
function scan(){return '<div class="head"><div><h1>Inventory Scanner</h1><div class="muted">Use phone camera for QR/barcode identification and rapid verification.</div></div><button class="btn primary" onclick="cameraScan()">📷 Start Camera</button></div><div class="grid two"><div class="panel"><h3>Scan a tag</h3><p>Scan an AssetVal QR tag or CODE128 barcode. The matching asset opens for verification.</p><button class="btn primary" onclick="cameraScan()">Start Scanner</button></div><div class="panel"><h3>Fast verification</h3><p>Manual tag lookup for devices without camera support.</p><div class="toolbar"><input id="manualTag" placeholder="Enter asset tag"><button class="btn" onclick="manualScan()">Find</button></div></div></div>'}
async function cameraScan(){if(!('BarcodeDetector' in window)){alert('Camera scanning needs a supported Chrome/Edge browser and HTTPS/localhost.');return}let m=document.getElementById('modal');m.className='modal';m.innerHTML='<div class="panel"><h2>Inventory Scanner</h2><video id="cam" autoplay playsinline style="width:100%;max-height:430px"></video><p class="muted">Point the camera at a QR or barcode.</p><button class="btn" onclick="closeModal()">Cancel</button></div>';let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});let v=document.getElementById('cam');v.srcObject=stream;let d=new BarcodeDetector({formats:['qr_code','code_128']});let loop=async()=>{if(m.className==='hidden'){stream.getTracks().forEach(t=>t.stop());return}try{let z=await d.detect(v);if(z.length){let raw=z[0].rawValue,idv=(raw.split('#asset=')[1]||'');let a=db.assets.find(x=>x.id===idv||x.tag===raw);stream.getTracks().forEach(t=>t.stop());closeModal();if(a){a.verified=true;a.lastScan=new Date().toLocaleString();db.audit.push({companyId:db.activeCompany,action:'Inventory Scan / Verified',tag:a.tag,by:me().name,at:a.lastScan});save();assetForm(a.id)}else alert('Asset not found: '+raw);return}}catch(e){}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function manualScan(){let t=document.getElementById('manualTag').value.trim(),a=db.assets.find(x=>x.companyId===db.activeCompany&&(x.tag===t||x.serial===t));if(a){a.verified=true;db.audit.push({companyId:db.activeCompany,action:'Manual Scan / Verified',tag:a.tag,by:me().name,at:new Date().toLocaleString()});save();assetForm(a.id)}else alert('Asset not found')}
function tag(i){let a=db.assets.find(x=>x.id===i);document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>Asset Tag '+esc(a.tag)+'</h2><div id="qr"></div><svg id="bc"></svg><p>'+esc(a.name)+' · '+esc(a.serial)+'</p><button class="btn primary" onclick="window.print()">Print</button> <button class="btn" onclick="closeModal()">Close</button></div>';let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';s.onload=()=>new QRCode(document.getElementById('qr'),{text:location.href.split('#')[0]+'#asset='+a.id,width:180,height:180});document.head.appendChild(s);let b=document.createElement('script');b.src='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';b.onload=()=>JsBarcode('#bc',a.tag,{format:'CODE128',width:2,height:60,displayValue:true});document.head.appendChild(b)}
function attachForm(i){let m=document.getElementById('modal');m.className='modal';m.innerHTML='<div class="panel"><h2>Attachments</h2><div class="drop"><input id="af" type="file" multiple><p>Photos, invoices, warranty and service documents</p></div><br><button class="btn primary" onclick="saveAttachments(\''+i+'\')">Store Attachments</button> <button class="btn" onclick="closeModal()">Cancel</button><div id="alist"></div></div>';let list=db.attachments.filter(a=>a.asset===i);document.getElementById('alist').innerHTML=list.map(a=>'<div class="timeline"><div><b>'+esc(a.name)+'</b> · '+Math.round(a.size/1024)+' KB</div></div>').join('')}
async function saveAttachments(i){let files=[...document.getElementById('af').files];for(let f of files){if(f.size>3000000){alert('File '+f.name+' is over 3 MB');continue}let data=await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});db.attachments.push({id:id(),companyId:db.activeCompany,asset:i,name:f.name,size:f.size,type:f.type,data});}save();closeModal();alert('Attachments stored locally in this browser.')}
function timeline(i){let a=db.assets.find(x=>x.id===i),items=db.audit.filter(x=>x.tag===a.tag).concat(db.transfers.filter(x=>x.asset===i));document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>Lifecycle Timeline</h2><div class="timeline">'+items.map(x=>'<div>'+esc(x.at||'')+' — <b>'+esc(x.action||'Transfer')+'</b> '+esc(x.reason||'')+'</div>').join('')+'</div><button class="btn" onclick="closeModal()">Close</button></div>'}
function transferForm(i){let a=db.assets.find(x=>x.id===i);document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>Transfer '+esc(a.tag)+'</h2>'+fld('New location','to','',false,'select',[''].concat(db.locations.filter(x=>x.companyId===db.activeCompany).map(x=>x.id)))+fld('Reason','reason','')+'<br><button class="btn primary" onclick="transfer(\''+i+'\')">Submit Transfer</button></div>'}
function transfer(i){let a=db.assets.find(x=>x.id===i),to=document.getElementById('f_to').value;a.pendingLocation=to;a.approval='Pending';db.transfers.push({asset:i,from:a.location,to,reason:document.getElementById('f_reason').value,at:new Date().toLocaleString()});requestApproval('Asset Transfer',i);save();closeModal();go('approvals')}
function reports(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany),c=aa.reduce((s,a)=>s+(+a.cost||0),0),b=aa.reduce((s,a)=>s+book(a),0),m=aa.reduce((s,a)=>s+market(a),0);return '<div class="head"><div><h1>Advanced Reports</h1><div class="muted">Valuation, depreciation, audit, replacement, warranty and branch reports.</div></div><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="cards">'+metric('Assets',aa.length)+metric('Acquisition',money(c))+metric('Book Value',money(b))+metric('Market Value',money(m))+metric('Depreciation',money(c-b))+metric('Verified',aa.filter(a=>a.verified).length)+'</div><div class="grid two" style="margin-top:14px"><div class="panel"><h3>Category Valuation</h3>'+['IT Equipment','TV / Display','Refrigerator / Appliance','CCTV / ELV','Furniture','Vehicle','Machinery','Other'].map(k=>{let q=aa.filter(a=>a.category===k);return '<div>'+k+' — '+q.length+' · '+money(q.reduce((s,a)=>s+book(a),0))+'</div>'}).join('')+'</div><div class="panel"><h3>Audit Exceptions</h3><p>Unverified: '+aa.filter(a=>!a.verified).length+'</p><p>Lost: '+aa.filter(a=>a.status==='Lost').length+'</p><p>Damaged: '+aa.filter(a=>a.status==='Damaged').length+'</p><p>Pending approvals: '+db.approvals.filter(x=>x.companyId===db.activeCompany&&x.status==='Pending').length+'</p></div></div><div class="panel" style="margin-top:14px"><h3>Asset Detail</h3><table class="table"><tr><th>Tag</th><th>Asset</th><th>Site</th><th>Cost</th><th>Book</th><th>Market</th><th>Status</th></tr>'+aa.map(a=>'<tr><td>'+esc(a.tag)+'</td><td>'+esc(a.name)+'</td><td>'+esc(loc(a.location))+'</td><td>'+money(a.cost)+'</td><td>'+money(book(a))+'</td><td>'+money(market(a))+'</td><td>'+esc(a.status)+'</td></tr>').join('')+'</table></div>'}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AssetVal-Pro-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function backupView(){return '<div class="head"><h1>Backup / Restore</h1></div><div class="grid two"><div class="panel"><h3>Backup</h3><p>Export the complete local database including companies, assets, approvals, audit history and attachments.</p><button class="btn primary" onclick="backup()">Download Full Backup</button></div><div class="panel"><h3>Restore</h3><input id="restore" type="file" accept=".json"><br><br><button class="btn" onclick="restore()">Restore Selected Backup</button></div></div>'}
function restore(){let f=document.getElementById('restore').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.companies||!x.assets)throw 0;db=x;save();render();alert('Backup restored')}catch(e){alert('Invalid AssetVal Pro backup')}};r.readAsText(f)}
function notify(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany),today=new Date(),items=[];aa.forEach(a=>{[['Warranty',a.warrantyEnd],['AMC',a.amcEnd]].forEach(([t,d])=>{if(d){let days=(new Date(d)-today)/86400000;if(days<=30)items.push({title:t+' due',body:a.tag+' — '+a.name+' due '+d,read:false})}});if(age(a)>=(+a.life||5)*.8)items.push({title:'Replacement planning',body:a.tag+' is near end of useful life',read:false})});db.notifications=db.notifications.concat(items.map(x=>({...x,id:id(),companyId:db.activeCompany,at:new Date().toLocaleString()}))).slice(-200);save();let ns=db.notifications.filter(n=>n.companyId===db.activeCompany);return '<div class="head"><h1>Notifications</h1><button class="btn primary" onclick="generateNotifications();render()">Refresh Alerts</button></div><div class="panel">'+(ns.length?ns.slice().reverse().map(n=>'<div class="notice"><b>'+esc(n.title)+'</b><br>'+esc(n.body)+'<br><small>'+esc(n.at)+'</small></div>').join(''):'No alerts')+'</div>'}
function generateNotifications(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany),now=Date.now();aa.forEach(a=>{[['Warranty',a.warrantyEnd],['AMC',a.amcEnd]].forEach(([t,d])=>{if(d){let days=(new Date(d)-now)/86400000;if(days>=0&&days<=30&&!db.notifications.some(n=>n.companyId===db.activeCompany&&n.body&&n.body.includes(a.tag+' — '+a.name)&&n.title===t+' due'))db.notifications.push({id:id(),companyId:db.activeCompany,title:t+' due',body:a.tag+' — '+a.name+' due '+d,read:false,at:new Date().toLocaleString()})}})});save()}
function finance(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany),cost=aa.reduce((s,a)=>s+(+a.cost||0),0),bookv=aa.reduce((s,a)=>s+book(a),0),marketv=aa.reduce((s,a)=>s+market(a),0),annual=aa.reduce((s,a)=>s+((+a.cost||0)-(+a.salvage||0))/Math.max(1,+a.life||5),0),repl=aa.filter(a=>age(a)>=(+a.life||5)*.8||+a.condition<50).reduce((s,a)=>s+(+a.cost||0),0);return '<div class="head"><h1>Financial Analytics</h1><div class="muted">Management view of asset capital, depreciation and replacement exposure.</div></div><div class="cards">'+metric('Gross Acquisition',money(cost))+metric('Current Book',money(bookv))+metric('Indicative Market',money(marketv))+metric('Accumulated Depreciation',money(cost-bookv))+metric('Annual Depreciation',money(annual))+metric('Replacement Budget',money(repl))+'</div><div class="grid two" style="margin-top:14px"><div class="panel"><h3>Value Mix</h3><p>Book / Cost: '+(cost?(bookv/cost*100).toFixed(1):0)+'%</p><p>Market / Cost: '+(cost?(marketv/cost*100).toFixed(1):0)+'%</p><p>Condition-adjusted value: '+money(marketv)+'</p></div><div class="panel"><h3>Forecast</h3>'+forecastBars(aa)+'</div></div>'}
function settings(){let c=company();return '<div class="head"><h1>Company Setup</h1></div><div class="panel"><div class="form">'+fld('Company name','name',c.name,true)+fld('Registration','reg',c.reg)+fld('VAT','vat',c.vat)+fld('Contact','contact',c.contact)+fld('Address','address',c.address,true)+fld('Currency','currency',c.currency,false,'select',['SAR','INR','USD','AED','EUR','GBP'])+fld('Valuation date','valuationDate',c.valuationDate,false,'date')+fld('Depreciation method','method',c.method,false,'select',['straight','declining','sumdigits'])+fld('Default rate %','rate',c.rate)+fld('Default life','lifeDefault',c.lifeDefault)+fld('Logo URL','logo',c.logo,true)+'</div><br><button class="btn primary" onclick="saveSettings()">Save Settings</button></div>'}
function saveSettings(){let c=company();['name','reg','vat','contact','address','currency','valuationDate','method','rate','lifeDefault','logo'].forEach(k=>{let e=document.getElementById('f_'+k);if(e)c[k]=e.value});save();render()}
function users(){if(!can('Admin'))return '<div class="panel"><h2>Admin access required</h2></div>';return '<div class="head"><h1>Users & Security</h1><button class="btn primary" onclick="userForm()">+ User</button></div><div class="panel"><table class="table"><tr><th>User</th><th>Name</th><th>Role</th></tr>'+users.map(u=>'<tr><td>'+esc(u.user)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.role)+'</td></tr>').join('')+'</table><p class="muted">Roles: Admin, Asset Manager, Auditor, Viewer. This v0.3 login is local-browser security; production multi-user authentication should move to a server identity provider.</p></div>'}
function userForm(){document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML='<div class="panel"><h2>New User</h2>'+fld('Username','user','')+fld('Name','name','')+fld('Password','pass','',false,'password')+fld('Role','role','Asset Manager',false,'select',['Admin','Asset Manager','Auditor','Viewer'])+'<br><button class="btn primary" onclick="saveUser()">Create</button></div>'}
function saveUser(){users.push({id:id(),user:document.getElementById('f_user').value,name:document.getElementById('f_name').value,pass:document.getElementById('f_pass').value,role:document.getElementById('f_role').value});save();closeModal();go('users')}
function excelExport(){let aa=db.assets.filter(a=>a.companyId===db.activeCompany),rows=[['Tag','Name','Model','Serial','Category','Site','Custodian','Cost','Book Value','Market Value','Status','Verified']].concat(aa.map(a=>[a.tag,a.name,a.model,a.serial,a.category,loc(a.location),emp(a.employee),a.cost,Math.round(book(a)),Math.round(market(a)),a.status,a.verified]));let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='AssetVal-Pro-Enterprise-Assets.csv';a.click()}
function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
function viewMap(){return ''}
function serviceWorker(){if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{})}
function init(){if(!db.companies.length)db.companies=seed.companies;generateNotifications();render();serviceWorker()}
init();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetVal Pro — Physical Audit</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Inter,system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:22px;border:1px solid #e5e7eb;border-radius:16px;margin-bottom:18px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #d1d5db;border-radius:9px}button{background:#111827;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:20px}.checks label{display:flex;gap:7px;align-items:center}.checks input{width:auto}.asset{padding:14px;background:#f8fafc;border-radius:12px;margin-top:10px}.qr{display:flex;justify-content:center;margin:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>Physical Asset Audit</h1><p>Scan or enter the asset tag, verify the physical asset, then submit the inspection.</p><input id="org" placeholder="Organization UUID"><input id="tag" placeholder="Asset ID e.g. AST-IT-00258"><button onclick="findAsset()">Find Asset</button><div id="asset"></div></div><div class="card" id="form" style="display:none"><h2>Inspection</h2><div class="grid"><div><label>Condition</label><select id="condition"><option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option><option>Damaged</option><option>Scrap</option></select></div><div><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"></div></div><div class="checks"><label><input id="serial" type="checkbox"> Serial verified</label><label><input id="location" type="checkbox"> Location verified</label></div><textarea id="comments" rows="5" placeholder="Technician comments"></textarea><button onclick="submitAudit()">Submit Physical Audit</button><div id="msg"></div></div></main><script>const API=localStorage.getItem('assetvalApi')||'http://localhost:8080';let asset=null;function headers(){const t=localStorage.getItem('assetvalAccessToken');return t?{Authorization:'Bearer '+t}:{}}async function findAsset(){const org=document.getElementById('org').value.trim(),tag=document.getElementById('tag').value.trim();if(!org||!tag)return;const r=await fetch(API+'/v1/assets/lookup/'+encodeURIComponent(tag)+'?orgId='+encodeURIComponent(org),{headers:headers()});const el=document.getElementById('asset');if(!r.ok){el.textContent='Asset not found.';document.getElementById('form').style.display='none';return}asset=await r.json();el.innerHTML='<div class="asset"><b>'+esc(asset.tag)+'</b><br>'+esc(asset.name)+'<br>Serial: '+esc(asset.serial||'—')+'<br>Location: '+esc(asset.location||'—')+'<br>Category: '+esc(asset.category||'—')+'</div><div class="qr" id="qr"></div>';new QRCode(document.getElementById('qr'),{text:location.origin+'/asset/'+asset.tag,width:150,height:150});document.getElementById('form').style.display='block'}async function submitAudit(){if(!asset)return;const org=document.getElementById('org').value.trim(),body={orgId:org,serialVerified:document.getElementById('serial').checked,locationVerified:document.getElementById('location').checked,condition:document.getElementById('condition').value,comments:document.getElementById('comments').value};const r=await fetch(API+'/v1/assets/'+asset.id+'/audit-scan',{method:'POST',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify(body)});document.getElementById('msg').textContent=r.ok?'Physical audit completed successfully.':'Audit failed.'}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetVal Pro — Locations</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{padding:20px 28px;background:#111827;color:white}main{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px;max-width:1400px;margin:auto}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0000000a}button,input,select{padding:9px 11px;border:1px solid #d1d5db;border-radius:8px}button{cursor:pointer;background:#111827;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tree ul{list-style:none;padding-left:18px}.node{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;cursor:pointer}.node:hover,.node.active{background:#eef2ff}.muted{color:#6b7280;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;background:#f8fafc;border-radius:10px}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.hidden{display:none}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head>
<body><header><strong>AssetVal Pro</strong> <span style="opacity:.7">/ Locations & Departments v1.0</span></header>
<main><section class="card"><div class="toolbar"><input id="search" placeholder="Search locations…" oninput="renderTree()"><button onclick="load()">Refresh</button></div><div class="toolbar"><select id="type"><option value="site">Site / Branch</option><option value="building">Building</option><option value="floor">Floor</option><option value="area">Area</option><option value="room">Room</option><option value="department">Department</option></select><input id="name" placeholder="Location name"><button onclick="add()">Add</button></div><div id="tree" class="tree"></div></section>
<section class="card"><h2 id="title">Select a location</h2><div id="stats" class="stats"></div><div class="toolbar" style="margin-top:14px"><button onclick="moveSelected()">Move selected assets here</button><button onclick="clearSelection()">Clear</button></div><table class="table"><thead><tr><th><input type="checkbox" onclick="toggleAll(this)"></th><th>Tag</th><th>Asset</th><th>Category</th><th>Value</th><th>Status</th></tr></thead><tbody id="assets"></tbody></table></section></main>
<script>
const API=localStorage.getItem('assetvalApi')||'http://localhost:8080';const ORG=localStorage.getItem('assetvalOrgId')||'';let locations=[],selected=null,assets=[];
async function load(){if(!ORG){alert('Set assetvalOrgId in local storage before using the production API.');return}const r=await fetch(API+'/v1/locations?orgId='+encodeURIComponent(ORG));locations=await r.json();renderTree()}
function renderTree(){const q=document.getElementById('search').value.toLowerCase();const roots=locations.filter(x=>!x.parentId);document.getElementById('tree').innerHTML=roots.map(x=>node(x,q)).join('')||'<div class="muted">No locations yet.</div>'}
function node(x,q){const kids=locations.filter(y=>y.parentId===x.id);const matches=!q||x.name.toLowerCase().includes(q)||(x.code||'').toLowerCase().includes(q);const child=kids.map(y=>node(y,q)).join('');if(q&&!matches&&!child)return'';return '<div><div class="node '+(selected?.id===x.id?'active':'')+'" onclick="select(''+x.id+'')"><span onclick="event.stopPropagation();toggle(this)">▸</span><b>'+esc(x.name)+'</b><span class="muted">('+x.locationType+')</span><span class="muted">['+x.assetCount+']</span></div><ul>'+child+'</ul></div>'}
function toggle(el){el.textContent=el.textContent==='▸'?'▾':'▸';el.parentElement.nextElementSibling.classList.toggle('hidden')}
async function select(id){selected=locations.find(x=>x.id===id);document.getElementById('title').textContent=selected.name;document.getElementById('stats').innerHTML='<div class="stat"><b>'+selected.assetCount+'</b><div class="muted">Assets</div></div><div class="stat"><b>'+money(selected.assetValue)+'</b><div class="muted">Location valuation</div></div><div class="stat"><b>'+selected.locationType+'</b><div class="muted">Type</div></div>';const r=await fetch(API+'/v1/locations/'+id+'/assets?orgId='+ORG);assets=await r.json();document.getElementById('assets').innerHTML=assets.map(a=>'<tr><td><input class="assetPick" value="'+a.id+'" type="checkbox"></td><td>'+esc(a.tag)+'</td><td>'+esc(a.assetName)+'</td><td>'+esc(a.category||'')+'</td><td>'+money(a.cost)+'</td><td>'+esc(a.status)+'</td></tr>').join('');renderTree()}
async function add(){if(!ORG||!document.getElementById('name').value.trim())return alert('Organization and name are required.');const parent=selected?.id||null;const body={orgId:ORG,parentId:parent,locationType:document.getElementById('type').value,name:document.getElementById('name').value.trim()};const r=await fetch(API+'/v1/locations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert('Could not create location.');document.getElementById('name').value='';await load()}
async function moveSelected(){if(!selected)return alert('Select a destination location.');const ids=[...document.querySelectorAll('.assetPick:checked')].map(x=>x.value);if(!ids.length)return alert('Select assets first.');const r=await fetch(API+'/v1/locations/'+selected.id+'/move-assets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orgId:ORG,assetIds:ids,reason:'Location Management UI'})});if(!r.ok)return alert('Move failed.');await select(selected.id);await load()}
function toggleAll(x){document.querySelectorAll('.assetPick').forEach(y=>y.checked=x.checked)}function clearSelection(){selected=null;document.getElementById('title').textContent='Select a location';document.getElementById('stats').innerHTML='';document.getElementById('assets').innerHTML='';renderTree()}function money(v){return new Intl.NumberFormat(undefined,{style:'currency',currency:'SAR',maximumFractionDigits:2}).format(Number(v||0))}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AssetVal Pro — Asset Register</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e4e8f0;--text:#172033;--muted:#6b7485;--accent:#2457d6;--good:#168653;--warn:#b26a00;--bad:#c63d45;--shadow:0 8px 28px rgba(20,35,70,.07)}
*{box-sizing:border-box}body{margin:0;font:14px Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#eef2f8;color:var(--text)}.danger{background:#fff0f1;color:var(--bad)}.wrap{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.head h1{margin:0 0 4px;font-size:25px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}.filters{display:grid;grid-template-columns:2fr repeat(6,1fr);gap:9px}.filters input,.filters select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#f0f4fb;border-radius:999px;padding:7px 11px;color:#4d5870}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#fafbfe;position:sticky;top:0}.tag{font-weight:700;color:var(--accent)}.status{padding:5px 9px;border-radius:999px;font-size:12px;background:#eef3ff}.status.Damaged,.status.Lost{background:#fff0f1;color:var(--bad)}.status.Active{background:#eaf8f1;color:var(--good)}.rowactions{display:flex;gap:5px}.rowactions button{padding:7px 9px;font-size:12px}.modal{position:fixed;inset:0;background:rgba(15,24,43,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{background:#fff;border-radius:16px;max-width:980px;width:100%;max-height:92vh;overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.field.full{grid-column:1/-1}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kv{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fafbfe}.kv small{display:block;color:var(--muted);margin-bottom:4px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.qrbox{display:flex;gap:25px;align-items:center;flex-wrap:wrap}.printprofile{background:#fff;padding:25px}.profiletitle{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:15px}.profiletable{width:100%;border-collapse:collapse}.profiletable td{border:1px solid #ddd;padding:8px}.profiletable td:first-child{font-weight:700;width:30%;background:#f5f5f5}.notice{padding:10px;border-radius:9px;background:#fff7e7;color:#805300;margin-top:10px;font-size:13px}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.grid,.detailgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:12px}.filters,.grid,.detailgrid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff}.no-print{display:none!important}.modal{position:static;display:block;background:none;padding:0}.dialog{box-shadow:none;max-width:none;max-height:none}.printprofile{padding:0}.printprofile~*{display:none!important}}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1>Asset Register</h1><div class="muted">Search, filter, edit, value, transfer and print company assets.</div></div><div class="actions"><button class="ghost" onclick="location.href='add-asset.html'">＋ Add Asset</button><button class="primary" onclick="load()">↻ Refresh</button></div></div>
<div class="card"><div class="filters">
<input id="search" placeholder="Search tag, asset, serial, brand or model…" oninput="debounceLoad()">
<select id="category"><option value="">All Categories</option></select>
<select id="location"><option value="">All Locations</option></select>
<select id="department"><option value="">All Departments</option></select>
<select id="custodian"><option value="">All Custodians</option></select>
<select id="vendor"><option value="">All Vendors</option></select>
<select id="status"><option value="">All Status</option><option>Active</option><option>Lost</option><option>Damaged</option><option>Disposed</option><option>Under Repair</option></select>
</div></div>
<div class="card"><div class="summary"><span class="pill" id="count">0 assets</span><span class="pill" id="value">SAR 0.00</span><span class="pill" id="book">Book value SAR 0.00</span></div>
<div class="tablewrap"><table class="table"><thead><tr><th>Asset ID</th><th>Asset</th><th>Category</th><th>Location</th><th>Department</th><th>Custodian</th><th>Vendor</th><th>Cost</th><th>Book Value</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>

<div class="modal" id="detailModal"><div class="dialog"><div class="modalhead"><h2>Asset Details</h2><button class="ghost" onclick="closeModal('detailModal')">Close</button></div><div id="detail"></div></div></div>
<div class="modal" id="editModal"><div class="dialog"><div class="modalhead"><h2>Edit Asset</h2><button class="ghost" onclick="closeModal('editModal')">Close</button></div><form id="editForm"><div class="grid" id="editFields"></div><div class="actions" style="margin-top:15px"><button class="primary">Save Changes</button><button type="button" class="ghost" onclick="closeModal('editModal')">Cancel</button></div></form></div></div>
<div class="modal" id="qrModal"><div class="dialog"><div class="modalhead"><h2>QR / Barcode</h2><button class="ghost" onclick="closeModal('qrModal')">Close</button></div><div class="qrbox"><div id="qrcode"></div><div><svg id="barcode"></svg><p class="muted" id="qrlabel"></p></div></div></div></div>
<div class="modal" id="transferModal"><div class="dialog"><div class="modalhead"><h2>Transfer Asset</h2><button class="ghost" onclick="closeModal('transferModal')">Close</button></div><form id="transferForm"><div class="grid"><div class="field"><label>Destination</label><select id="transferLocation" required></select></div><div class="field full"><label>Reason</label><input id="transferReason" placeholder="e.g. moved to Riyadh Head Office meeting room"></div></div><div class="actions" style="margin-top:15px"><button class="primary">Transfer Asset</button></div></form></div></div>
<div class="modal" id="profileModal"><div class="dialog"><div class="no-print modalhead"><h2>Printable Asset Profile</h2><div class="actions"><button class="primary" onclick="window.print()">Print / Save PDF</button><button class="ghost" onclick="closeModal('profileModal')">Close</button></div></div><div id="profile"></div></div></div>

<script>
const API=localStorage.getItem('assetvalApi')||'http://localhost:8080';
const ORG=localStorage.getItem('assetvalOrgId')||'00000000-0000-0000-0000-000000000000';
let assets=[],editing=null,transferId=null,timer;
const money=n=>'SAR '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const qs=id=>document.getElementById(id);
async function api(path,opts){const r=await fetch(API+path,opts);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.json()}
async function loadOptions(){
  const [cats,locs]=await Promise.all([api('/v1/categories?orgId='+ORG),api('/v1/locations?orgId='+ORG)]);
  const allLoc=[...locs]; // top-level; child locations are loaded recursively below
  async function children(parent){const x=await api('/v1/locations?orgId='+ORG+'&parentId='+parent);for(const l of x){allLoc.push(l);await children(l.id)}}
  for(const l of [...locs]) await children(l.id);
  const people=await api('/v1/assets?orgId='+ORG);
  const fill=(id,items,label,key)=>{const e=qs(id);e.innerHTML='<option value="">All '+label+'</option>'+items.map(x=>'<option value="'+x[key]+'">'+esc(x.name||x[key])+'</option>').join('')};
  const unique=(arr,k)=>[...new Map(arr.filter(x=>x[k]).map(x=>[x[k],x])).values()];
  fill('category',cats.filter(x=>!x.parentId),'Categories','id');
  fill('location',unique(allLoc,'id'),'Locations','id');
  fill('department',allLoc.filter(x=>x.locationType==='department'),'Departments','id');
  fill('custodian',unique(people,'custodianId').map(x=>({id:x.custodianId,name:x.custodianName})),'Custodians','id');
  fill('vendor',unique(people,'vendorId').map(x=>({id:x.vendorId,name:x.vendorName})),'Vendors','id');
}
function debounceLoad(){clearTimeout(timer);timer=setTimeout(load,250)}
async function load(){
  try{
    const p=new URLSearchParams({orgId:ORG});[['search','search'],['category','categoryId'],['location','locationId'],['department','departmentId'],['custodian','custodianId'],['vendor','vendorId'],['status','status']].forEach(([a,b])=>{if(qs(a).value)p.set(b,qs(a).value)});
    assets=await api('/v1/assets?'+p);render();
  }catch(e){qs('rows').innerHTML='<tr><td colspan="11">Unable to load assets: '+esc(e.message)+'</td></tr>'}
}
function render(){
  qs('count').textContent=assets.length+' assets';qs('value').textContent=money(assets.reduce((s,a)=>s+Number(a.cost||0),0));
  const books=assets.reduce((s,a)=>s+calc(a).bookValue,0);qs('book').textContent='Book value '+money(books);
  qs('rows').innerHTML=assets.map(a=>{const d=calc(a);return '<tr><td class="tag">'+esc(a.tag)+'</td><td><b>'+esc(a.assetName)+'</b><br><span class="muted">'+esc(a.brand||'')+' '+esc(a.model||'')+'</span></td><td>'+esc(a.categoryName||'—')+'</td><td>'+esc(a.locationName||'—')+'</td><td>'+esc(a.departmentName||'—')+'</td><td>'+esc(a.custodianName||'—')+'</td><td>'+esc(a.vendorName||'—')+'</td><td>'+money(a.cost)+'</td><td>'+money(d.bookValue)+'</td><td><span class="status '+esc(a.status)+'">'+esc(a.status)+'</span></td><td><div class="rowactions"><button class="ghost" onclick="details(\''+a.id+'\')">View</button><button class="ghost" onclick="edit(\''+a.id+'\')">Edit</button><button class="ghost" onclick="qr(\''+a.id+'\')">QR</button><button class="ghost" onclick="transfer(\''+a.id+'\')">Move</button><button class="ghost" onclick="profile(\''+a.id+'\')">Print</button></div></td></tr>'}).join('')||'<tr><td colspan="11">No assets found.</td></tr>';
}
function calc(a){const cost=Number(a.cost||0),salv=Number(a.salvageValue||0),life=Number(a.usefulLifeYears||5);const start=a.purchaseDate?new Date(a.purchaseDate):new Date(),years=Math.max(0,Math.min(life,(Date.now()-start.getTime())/(365.25*864e5)));let dep=0;if(a.depreciationMethod==='declining_balance'){dep=cost*(1-Math.pow(Math.max(0,1-2/life),years))}else if(a.depreciationMethod==='sum_of_years_digits'){const total=life*(life+1)/2;for(let y=1;y<=Math.min(Math.ceil(years),life);y++)dep+=(cost-salv)*(life-y+1)/total}else dep=(cost-salv)*(life?Math.min(years/life,1):0);dep=Math.max(0,Math.min(cost-salv,dep));return {years,dep,bookValue:Math.max(salv,cost-dep)}}
function openModal(id){qs(id).classList.add('open')}function closeModal(id){qs(id).classList.remove('open')}
async function details(id){const a=await api('/v1/assets/'+id+'?orgId='+ORG),d=calc(a),atts=await api('/v1/assets/'+id+'/attachments?orgId='+ORG);qs('detail').innerHTML='<div class="detailgrid">'+kv('Asset ID',a.tag)+kv('Asset',a.assetName)+kv('Category',a.categoryName)+kv('Brand',a.brand)+kv('Model',a.model)+kv('Serial',a.serial)+kv('Location',a.locationName)+kv('Custodian',a.custodianName)+kv('Vendor',a.vendorName)+kv('Condition',a.condition)+kv('Status',a.status)+kv('Purchase Date',a.purchaseDate)+kv('Cost',money(a.cost))+kv('Useful Life',a.useful_life_years+' years')+kv('Salvage Value',money(a.salvage_value))+kv('Method',a.depreciation_method)+kv('Accumulated Dep.',money(d.dep))+kv('Book Value',money(d.bookValue))+'</div><div class="card" style="margin-top:14px"><b>Photo / Documents</b><p class="muted">'+(atts.length?atts.map(x=>esc(x.objectKey)).join('<br>'):'No cloud attachments linked yet.')+'</p><div class="notice">Secure object-storage upload is the next attachment backend step; this register already reads attachment metadata from the production API.</div></div>';openModal('detailModal')}
function kv(k,v){return '<div class="kv"><small>'+esc(k)+'</small><b>'+esc(v||'—')+'</b></div>'}
async function edit(id){editing=await api('/v1/assets/'+id+'?orgId='+ORG);const fields=[['tag','Asset ID','text'],['assetName','Asset Name','text'],['brand','Brand','text'],['model','Model','text'],['serial','Serial','text'],['cost','Purchase Cost','number'],['purchaseDate','Purchase Date','date'],['usefulLifeYears','Useful Life (years)','number'],['salvageValue','Salvage Value','number']];qs('editFields').innerHTML=fields.map(f=>'<div class="field"><label>'+f[1]+'</label><input name="'+f[0]+'" type="'+f[2]+'" value="'+esc(editing[f[0]]??'')+'"></div>').join('')+'<div class="field"><label>Condition</label><select name="condition">'+['Excellent','Good','Fair','Poor','Damaged'].map(x=>'<option '+(editing.condition===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Status</label><select name="status">'+['Active','Lost','Damaged','Disposed','Under Repair'].map(x=>'<option '+(editing.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Depreciation Method</label><select name="depreciationMethod">'+[['straight_line','Straight Line'],['declining_balance','Declining Balance'],['sum_of_years_digits','Sum of Years Digits']].map(x=>'<option value="'+x[0]+'" '+(editing.depreciation_method===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>';openModal('editModal')}
qs('editForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());['cost','usefulLifeYears','salvageValue'].forEach(k=>data[k]=Number(data[k]||0));try{await api('/v1/assets/'+editing.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({...data,orgId:ORG})});closeModal('editModal');await load()}catch(x){alert(x.message)}};
async function qr(id){const a=await api('/v1/assets/'+id+'?orgId='+ORG);qs('qrcode').innerHTML='';new QRCode(qs('qrcode'),{text:location.origin+location.pathname+'#asset='+a.id,width:180,height:180});JsBarcode('#barcode',a.tag,{format:'CODE128',width:2,height:70,displayValue:true});qs('qrlabel').textContent=a.assetName+' • '+a.tag;openModal('qrModal')}
async function transfer(id){transferId=id;const locs=await api('/v1/locations?orgId='+ORG);let all=[...locs];async function c(p){const x=await api('/v1/locations?orgId='+ORG+'&parentId='+p);for(const l of x){all.push(l);await c(l.id)}}for(const l of [...locs])await c(l.id);qs('transferLocation').innerHTML=all.map(l=>'<option value="'+l.id+'">'+esc(l.name)+'</option>').join('');qs('transferReason').value='';openModal('transferModal')}
qs('transferForm').onsubmit=async e=>{e.preventDefault();try{await api('/v1/locations/'+qs('transferLocation').value+'/move-assets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({orgId:ORG,assetIds:[transferId],reason:qs('transferReason').value||null})});closeModal('transferModal');await load()}catch(x){alert(x.message)}};
async function profile(id){const a=await api('/v1/assets/'+id+'?orgId='+ORG),d=calc(a);qs('profile').innerHTML='<div class="printprofile"><div class="profiletitle"><div><h1>Asset Profile</h1><b>AssetVal Pro</b><div class="muted">Company Asset Intelligence System</div></div><div><b>'+esc(a.tag)+'</b><br>'+new Date().toLocaleDateString()+'</div></div><table class="profiletable">'+[['Asset ID',a.tag],['Asset Name',a.assetName],['Category',a.categoryName],['Brand',a.brand],['Model',a.model],['Serial Number',a.serial],['Location',a.locationName],['Custodian',a.custodianName],['Vendor',a.vendorName],['Condition',a.condition],['Status',a.status],['Purchase Date',a.purchaseDate],['Purchase Cost',money(a.cost)],['Useful Life',a.useful_life_years+' years'],['Salvage Value',money(a.salvage_value)],['Depreciation Method',a.depreciation_method],['Accumulated Depreciation',money(d.dep)],['Current Book Value',money(d.bookValue)]].map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1]||'—')+'</td></tr>').join('')+'</table><div style="margin-top:15px" class="muted">This profile is generated from the AssetVal Pro asset register. Market value is not an independent appraisal.</div></div>';openModal('profileModal')}
loadOptions().then(load).catch(e=>{console.error(e);load()});
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetVal Pro — Professional Dashboard</title>
<style>body{font-family:Inter,system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:24px 30px}main{max-width:1450px;margin:auto;padding:24px}.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.label{color:#6b7280;font-size:13px}.value{font-size:27px;font-weight:750;margin-top:8px}.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:20px;margin-top:20px}.cat{padding:14px 0;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between}.bar{height:9px;background:#e8ebef;border-radius:9px;margin-top:8px;overflow:hidden}.fill{height:100%;background:#172033}.alerts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.alert{padding:14px;border:1px solid #e5e7eb;border-radius:12px}.alert b{display:block;font-size:23px;margin-top:5px}.danger{color:#b42318}.warn{color:#b54708}.good{color:#067647}@media(max-width:1050px){.hero{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.hero{grid-template-columns:1fr 1fr}.alerts{grid-template-columns:1fr}}</style></head>
<body><header><b>AssetVal Pro</b><div>Executive Asset Intelligence Dashboard</div></header><main>
<section class="hero"><div class="card"><div class="label">Assets</div><div id="a" class="value">0</div></div><div class="card"><div class="label">Original Cost</div><div id="c" class="value">SAR 0</div></div><div class="card"><div class="label">Depreciation</div><div id="d" class="value">SAR 0</div></div><div class="card"><div class="label">Book Value</div><div id="b" class="value">SAR 0</div></div><div class="card"><div class="label">Estimated Market Value</div><div id="m" class="value">SAR 0</div></div></section>
<section class="grid"><div class="card"><h2>Asset Portfolio by Category</h2><div id="cats">Loading…</div></div><div class="card"><h2>Asset Attention</h2><div class="alerts"><div class="alert"><span>Missing</span><b id="missing" class="danger">—</b></div><div class="alert"><span>Damaged</span><b id="damaged" class="danger">—</b></div><div class="alert"><span>Warranty Expiring</span><b id="warranty" class="warn">—</b></div><div class="alert"><span>Not Verified</span><b id="verified" class="warn">—</b></div><div class="alert"><span>Due for Inspection</span><b id="inspection" class="warn">—</b></div><div class="alert"><span>Healthy / Active</span><b id="healthy" class="good">—</b></div></div></div></section>
</main><script>
const API=localStorage.getItem('assetvalApi')||'http://localhost:8080',org=localStorage.getItem('assetvalOrgId')||'';
const money=v=>new Intl.NumberFormat(undefined,{style:'currency',currency:'SAR',maximumFractionDigits:0}).format(Number(v||0));
const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
async function run(){if(!org)return;const r=await fetch(API+'/v1/dashboard/valuation?orgId='+encodeURIComponent(org));if(!r.ok)return;const x=await r.json(),t=x.total||{};document.getElementById('a').textContent=Number(t.assets||0).toLocaleString();document.getElementById('c').textContent=money(t.acquisitionValue);document.getElementById('b').textContent=money(t.bookValue);document.getElementById('m').textContent=money(t.marketValue);document.getElementById('d').textContent=money(Number(t.acquisitionValue||0)-Number(t.bookValue||0));
const cats=x.categories||[],max=Math.max(...cats.map(z=>Number(z.acquisition_value||0)),1);document.getElementById('cats').innerHTML=cats.map(z=>'<div class="cat"><div class="row"><b>'+esc(z.name)+'</b><b>'+Number(z.assets||0).toLocaleString()+'</b></div><div class="row"><small>Original Cost</small><small>'+money(z.acquisition_value)+'</small></div><div class="bar"><div class="fill" style="width:'+Math.round(Number(z.acquisition_value||0)/max*100)+'%"></div></div></div>').join('');
const ar=await fetch(API+'/v1/assets?orgId='+encodeURIComponent(org));if(ar.ok){const list=await ar.json();const miss=list.filter(z=>/^(lost|missing)$/i.test(z.status||'')).length,dam=list.filter(z=>/damaged/i.test((z.status||'')+' '+(z.condition||''))).length;document.getElementById('missing').textContent=miss;document.getElementById('damaged').textContent=dam;document.getElementById('healthy').textContent=Math.max(list.length-miss-dam,0)}}
run();
</script></body></html>

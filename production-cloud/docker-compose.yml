services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: assetval
      POSTGRES_USER: assetval
      POSTGRES_PASSWORD: change-me
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://assetval:change-me@postgres:5432/assetval
    depends_on: [postgres]
    ports: ["8080:8080"]
volumes:
  pgdata:

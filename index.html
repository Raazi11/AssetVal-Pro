<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetVal Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.top{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:21px;font-weight:800}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:220px;background:#111827;padding:18px 12px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:8px;margin:3px 0;cursor:pointer}nav button.active,nav button:hover{background:#1e293b;color:#fff}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.muted{color:#667085}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(5,1fr)}.card,.panel{background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:18px;box-shadow:0 8px 25px #00000009}.metric{font-size:25px;font-weight:800;margin-top:8px}.btn{border:1px solid #d9dee7;background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{padding:10px;border:1px solid #d9dee7;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e6eaf0;text-align:left;white-space:nowrap;font-size:13px}.table th{background:#f8fafc;color:#667085}.tablewrap{overflow:auto}.badge{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{padding:10px;border:1px solid #d9dee7;border-radius:8px;min-width:250px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:700px){aside{display:none}.main{padding:16px}.form{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start;gap:10px}}@media print{aside,.top,.actions,.toolbar{display:none}.main{padding:0}.panel{box-shadow:none}}
</style></head><body><div class="top"><div class="brand">◈ AssetVal Pro</div><div id="companyTitle">Company Asset Intelligence</div></div><div class="layout"><aside><nav id="nav"></nav></aside><main class="main" id="main"></main></div>
<script>
var KEY="assetval-pro-v1",db=JSON.parse(localStorage.getItem(KEY)||"null")||{company:{name:"",currency:"SAR",valuationDate:new Date().toISOString().slice(0,10),method:"straight",rate:20},locations:[],assets:[],audit:[]},page="company",filter="";
var cats=["IT Equipment","TV / Display","Refrigerator / Appliance","CCTV / ELV","Furniture","Vehicle","Machinery","Other"];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function money(n){try{return new Intl.NumberFormat(undefined,{style:"currency",currency:db.company.currency||"SAR",maximumFractionDigits:0}).format(Number(n)||0)}catch(e){return (Number(n)||0)+" "+db.company.currency}}
function dep(a){var c=+a.cost||0,l=Math.max(1,+a.life||5),s=Math.max(0,+a.salvage||0),age=Math.max(0,(new Date(db.company.valuationDate)-new Date(a.purchaseDate))/31557600000);return Math.max(s,c-Math.min(age,l)*(c-s)/l)}
function market(a){return Math.max(0,dep(a)*(.7+(+a.condition||100)/333))}
function loc(id){var x=db.locations.find(function(z){return z.id===id});return x?x.name:"Unassigned"}
function go(p){page=p;render()}
function render(){document.getElementById("companyTitle").textContent=db.company.name||"Company Asset Intelligence";document.getElementById("nav").innerHTML=[["dashboard","Dashboard"],["assets","Asset Register"],["locations","Locations"],["verify","Verify & Audit"],["valuation","Valuation"],["reports","Reports"],["settings","Company Setup"]].map(function(n){return "<button class='"+(page===n[0]?"active":"")+"' onclick=\"go('"+n[0]+"')\">"+n[1]+"</button>"}).join("");document.getElementById("main").innerHTML=view()}
function field(label,key,val,full,select,opts){var c=select?"<select id='f_"+key+"'>"+opts.map(function(o){return "<option value='"+esc(o)+"' "+(String(o)===String(val)?"selected":"")+">"+esc(o)+"</option>"}).join("")+"</select>":"<input id='f_"+key+"' value='"+esc(val)+"'>";return "<div class='field "+(full?"full":"")+"'><label>"+label+"</label>"+c+"</div>"}
function metric(a,b){return "<div class='card'><div class='muted'>"+a+"</div><div class='metric'>"+b+"</div></div>"}
function view(){if(page==="company"||page==="settings")return company();if(page==="dashboard")return dashboard();if(page==="assets")return assets();if(page==="locations")return locations();if(page==="verify")return verify();if(page==="valuation")return valuation();return reports()}
function company(){var c=db.company;return "<div class='head'><div><h1>Create Company</h1><div class='muted'>Create Company → Locations → Assets → Verify → Value → Report</div></div></div><div class='panel'><div class='form'>"+field("Company name","name",c.name,true)+field("Registration number","reg",c.reg||"")+field("VAT number","vat",c.vat||"")+field("Contact","contact",c.contact||"")+field("Address","address",c.address||"",true)+field("Base currency","currency",c.currency,false,true,["SAR","INR","USD","AED","EUR","GBP"])+field("Financial year","fy",c.fy||"2026")+field("Default valuation date","valuationDate",c.valuationDate)+field("Depreciation method","method",c.method,false,true,["straight","declining"])+field("Default rate %","rate",c.rate||20)+field("Default asset life","lifeDefault",c.lifeDefault||5)+field("Logo / URL","logo",c.logo||"")+"</div><br><button class='btn primary' onclick='saveCompany()'>Save Company</button></div>"}
function saveCompany(){["name","reg","vat","contact","address","currency","fy","valuationDate","method","rate","lifeDefault","logo"].forEach(function(k){var e=document.getElementById("f_"+k);if(e)db.company[k]=e.value});save();go("dashboard")}
function dashboard(){var n=db.assets.length,c=db.assets.reduce(function(s,a){return s+(+a.cost||0)},0),b=db.assets.reduce(function(s,a){return s+dep(a)},0),m=db.assets.reduce(function(s,a){return s+market(a)},0),v=db.assets.filter(function(a){return a.verified}).length;return "<div class='head'><div><h1>Asset Intelligence Dashboard</h1><div class='muted'>Register → Tag → Locate → Verify → Value → Depreciate → Maintain → Forecast → Audit → Report</div></div><button class='btn primary' onclick='newAsset()'>+ Add Asset</button></div><div class='grid cards'>"+metric("Assets",n)+metric("Acquisition Cost",money(c))+metric("Book Value",money(b))+metric("Market Value",money(m))+metric("Verified",v+" / "+n)+"</div><div class='panel' style='margin-top:18px'><h3>Verification Progress</h3><p>"+(n?Math.round(v/n*100):0)+"% verified</p><h3>Asset Categories</h3>"+cats.map(function(x){var q=db.assets.filter(function(a){return a.category===x}).length;return q?"<div>"+x+" — <b>"+q+"</b></div>":""}).join("")+"</div>"}
function assets(){var a=db.assets.filter(function(x){return JSON.stringify(x).toLowerCase().indexOf(filter.toLowerCase())>=0});return "<div class='head'><div><h1>Asset Register</h1><div class='muted'>Laptops, TVs, refrigerators, CCTV/ELV, furniture, vehicles, machinery and more.</div></div><button class='btn primary' onclick='newAsset()'>+ Add Asset</button></div><div class='panel'><div class='toolbar'><input placeholder='Search assets...' value='"+esc(filter)+"' oninput='filter=this.value;render()'><button class='btn' onclick='exportCSV()'>Export CSV</button><button class='btn' onclick='importCSV()'>Import CSV</button></div><div class='tablewrap'><table class='table'><tr><th>Tag</th><th>Asset</th><th>Category</th><th>Location</th><th>Cost</th><th>Book</th><th>Status</th><th></th></tr>"+a.map(function(x){return "<tr><td><b>"+esc(x.tag)+"</b></td><td>"+esc(x.name)+"</td><td>"+esc(x.category)+"</td><td>"+esc(loc(x.location))+"</td><td>"+money(x.cost)+"</td><td>"+money(dep(x))+"</td><td>"+(x.verified?"<span class='badge good'>Verified</span>":"<span class='badge warn'>Pending</span>")+"</td><td><button class='btn' onclick=\"newAsset('"+x.id+"')\">Open</button></td></tr>"}).join("")+"</table></div></div>"}
function newAsset(id){var a=id?db.assets.find(function(x){return x.id===id}):{id:crypto.randomUUID(),tag:"AV-"+String(db.assets.length+1).padStart(5,"0"),name:"",model:"",serial:"",category:"IT Equipment",location:"",purchaseDate:new Date().toISOString().slice(0,10),cost:0,life:db.company.lifeDefault||5,salvage:0,condition:100,verified:false,warranty:"",notes:""};document.getElementById("main").innerHTML="<div class='head'><h1>"+(id?"Asset Details":"Add Asset")+"</h1></div><div class='panel'><div class='form'>"+field("Asset tag","tag",a.tag)+field("Asset name","name",a.name)+field("Model","model",a.model)+field("Serial","serial",a.serial)+field("Category","category",a.category,false,true,cats)+field("Location","location",a.location,false,true,[""].concat(db.locations.map(function(x){return x.id})))+field("Purchase date","purchaseDate",a.purchaseDate)+field("Acquisition cost","cost",a.cost)+field("Useful life","life",a.life)+field("Salvage value","salvage",a.salvage)+field("Condition %","condition",a.condition)+field("Warranty","warranty",a.warranty)+"</div><br><button class='btn primary' onclick=\"saveAsset('"+a.id+"')\">Save Asset</button></div>"}
function saveAsset(id){var a=db.assets.find(function(x){return x.id===id})||{id:id};["tag","name","model","serial","category","location","purchaseDate","cost","life","salvage","condition","warranty"].forEach(function(k){a[k]=document.getElementById("f_"+k).value});if(!db.assets.find(function(x){return x.id===id}))db.assets.push(a);save();go("assets")}
function locations(){return "<div class='head'><h1>Locations</h1><button class='btn primary' onclick='newLocation()'>+ Add Location</button></div><div class='panel'><table class='table'><tr><th>Name</th><th>Department</th><th>Address</th><th>Assets</th></tr>"+db.locations.map(function(x){return "<tr><td>"+esc(x.name)+"</td><td>"+esc(x.dept)+"</td><td>"+esc(x.address)+"</td><td>"+db.assets.filter(function(a){return a.location===x.id}).length+"</td></tr>"}).join("")+"</table></div>"}
function newLocation(){var l={id:crypto.randomUUID(),name:"",dept:"",address:""};document.getElementById("main").innerHTML="<div class='head'><h1>Add Location</h1></div><div class='panel'><div class='form'>"+field("Location name","name","")+field("Department","dept","")+field("Address","address","",true)+"</div><br><button class='btn primary' onclick=\"saveLocation('"+l.id+"')\">Save Location</button></div>"}
function saveLocation(id){var l={id:id,name:document.getElementById("f_name").value,dept:document.getElementById("f_dept").value,address:document.getElementById("f_address").value};db.locations.push(l);save();go("locations")}
function verify(){var p=db.assets.filter(function(a){return !a.verified});return "<div class='head'><h1>Verify & Audit</h1><button class='btn primary' onclick='verifyAll()'>Verify All</button></div><div class='panel'><table class='table'><tr><th>Tag</th><th>Asset</th><th>Location</th><th>Condition</th><th></th></tr>"+p.map(function(a){return "<tr><td>"+esc(a.tag)+"</td><td>"+esc(a.name)+"</td><td>"+esc(loc(a.location))+"</td><td>"+a.condition+"%</td><td><button class='btn' onclick=\"verifyOne('"+a.id+"')\">Verify</button></td></tr>"}).join("")+"</table></div>"}
function verifyOne(id){var a=db.assets.find(function(x){return x.id===id});a.verified=true;db.audit.push({action:"Verified",tag:a.tag,at:new Date().toLocaleString()});save();render()}
function verifyAll(){db.assets.forEach(function(a){if(!a.verified){a.verified=true;db.audit.push({action:"Verified",tag:a.tag,at:new Date().toLocaleString()})}});save();render()}
function valuation(){var c=db.assets.reduce(function(s,a){return s+(+a.cost||0)},0),b=db.assets.reduce(function(s,a){return s+dep(a)},0),m=db.assets.reduce(function(s,a){return s+market(a)},0);return "<div class='head'><h1>Valuation Review</h1></div><div class='grid cards'>"+metric("Acquisition",money(c))+metric("Book Value",money(b))+metric("Market Value",money(m))+metric("Depreciation",money(c-b))+metric("Value Ratio",c?(b/c*100).toFixed(1)+"%":"0%")+"</div><div class='panel' style='margin-top:18px'><table class='table'><tr><th>Asset</th><th>Cost</th><th>Book</th><th>Market</th><th>Condition</th><th>Decision</th></tr>"+db.assets.map(function(a){var x=dep(a),r=a.condition<40?"Replace / Sell":a.condition<65?"Repair / Monitor":"Keep";return "<tr><td>"+esc(a.tag)+" — "+esc(a.name)+"</td><td>"+money(a.cost)+"</td><td>"+money(x)+"</td><td>"+money(market(a))+"</td><td>"+a.condition+"%</td><td>"+r+"</td></tr>"}).join("")+"</table></div>"}
function reports(){var c=db.assets.reduce(function(s,a){return s+(+a.cost||0)},0),b=db.assets.reduce(function(s,a){return s+dep(a)},0),m=db.assets.reduce(function(s,a){return s+market(a)},0);return "<div class='head'><h1>Company Asset Valuation Report</h1><button class='btn primary' onclick='window.print()'>Print / Save PDF</button></div><div class='panel'><h2>"+esc(db.company.name||"Company")+"</h2><p>Valuation date: "+esc(db.company.valuationDate)+" · Currency: "+esc(db.company.currency)+"</p><h3>Executive Summary</h3><p>Total assets: <b>"+db.assets.length+"</b> · Acquisition: <b>"+money(c)+"</b> · Book value: <b>"+money(b)+"</b> · Market value: <b>"+money(m)+"</b></p><table class='table'><tr><th>Tag</th><th>Name</th><th>Category</th><th>Location</th><th>Cost</th><th>Book</th><th>Status</th></tr>"+db.assets.map(function(a){return "<tr><td>"+esc(a.tag)+"</td><td>"+esc(a.name)+"</td><td>"+esc(a.category)+"</td><td>"+esc(loc(a.location))+"</td><td>"+money(a.cost)+"</td><td>"+money(dep(a))+"</td><td>"+(a.verified?"Verified":"Pending")+"</td></tr>"}).join("")+"</table></div>"}
function download(n,d,t){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
function exportCSV(){var h=["tag","name","model","serial","category","location","purchaseDate","cost","life","salvage","condition","verified","warranty"],out=[h.join(",")];db.assets.forEach(function(a){out.push(h.map(function(k){return "\""+String(k==="location"?loc(a[k]):a[k]||"").replace(/"/g,"\"\"")+"\""}).join(","))});download("asset-register.csv",out.join("\n"),"text/csv")}
function importCSV(){var i=document.createElement("input");i.type="file";i.accept=".csv";i.onchange=function(){var r=new FileReader();r.onload=function(){var z=String(r.result).split(/\r?\n/).filter(Boolean),h=z.shift().split(",");z.forEach(function(line){var v=line.match(/(?:"[^"]*"|[^,])+/g)||[],a={};h.forEach(function(k,j){a[k]=String(v[j]||"").replace(/^"|"$/g,"").replace(/""/g,"\"")});a.id=crypto.randomUUID();a.verified=a.verified==="true";db.assets.push(a)});save();render()};r.readAsText(i.files[0])};i.click()}
render();
</script></body></html>
